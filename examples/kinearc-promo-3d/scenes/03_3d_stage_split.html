<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc v3.0 — 03 3D Stage Split</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import {
      registerScene,
      createTorusKnotMesh,
      createTorusMesh,
      drawStageBackdrop,
      drawDepthParticles,
      drawGlassCard,
      drawPill,
      drawCornerHud,
      springProgress,
      easeOutCubic,
      easeInOutCubic,
      smoothstep,
      clamp01,
      lerp,
    } from "./kinearc-gl3d.js";

    const UI_FONT = '"Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
    const MONO_FONT = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

    // Seamless parallel-transport (Bishop frame) Torus Knot mesh with zero Frenet-flip seam
    function createSeamlessTorusKnot(R = 1.24, tube = 0.23, pVal = 2, qVal = 3, segU = 192, segV = 22) {
      const curve = (u) => {
        const r = 0.5 * (2 + Math.sin(qVal * u));
        return [
          R * r * Math.cos(pVal * u),
          R * r * Math.sin(pVal * u),
          R * 0.55 * Math.cos(qVal * u),
        ];
      };
      const tangent = (u) => {
        const e = 0.002;
        const a = curve(u - e), b = curve(u + e);
        const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
        const len = Math.hypot(dx, dy, dz) || 1;
        return [dx / len, dy / len, dz / len];
      };
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

      const centers = [];
      const tangents = [];
      const normals = [];
      const binormals = [];
      for (let i = 0; i <= segU; i++) {
        const u = (i / segU) * Math.PI * 2;
        centers.push(curve(u));
        tangents.push(tangent(u));
      }
      const T0 = tangents[0];
      const ref = Math.abs(T0[1]) < 0.8 ? [0, 1, 0] : [1, 0, 0];
      let N = norm(cross(T0, ref));
      let B = norm(cross(T0, N));
      normals.push(N);
      binormals.push(B);
      for (let i = 1; i <= segU; i++) {
        const T = tangents[i];
        const projN = [N[0] - dot(N, T) * T[0], N[1] - dot(N, T) * T[1], N[2] - dot(N, T) * T[2]];
        N = norm(projN);
        B = norm(cross(T, N));
        normals.push(N);
        binormals.push(B);
      }
      // Distribute any holonomy twist evenly across segU so start and end rings align seamlessly
      const endAngle = Math.atan2(dot(normals[segU], binormals[0]), dot(normals[segU], normals[0]));
      const rings = [];
      for (let i = 0; i <= segU; i++) {
        const twist = -endAngle * (i / segU);
        const ct = Math.cos(twist), st = Math.sin(twist);
        const Ni = normals[i], Bi = binormals[i];
        const nTwist = [ct * Ni[0] + st * Bi[0], ct * Ni[1] + st * Bi[1], ct * Ni[2] + st * Bi[2]];
        const bTwist = [-st * Ni[0] + ct * Bi[0], -st * Ni[1] + ct * Bi[1], -st * Ni[2] + ct * Bi[2]];
        const c = centers[i];
        const ring = [];
        for (let j = 0; j <= segV; j++) {
          const a = (j / segV) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          const rn = [ca * nTwist[0] + sa * bTwist[0], ca * nTwist[1] + sa * bTwist[1], ca * nTwist[2] + sa * bTwist[2]];
          ring.push({ pos: [c[0] + tube * rn[0], c[1] + tube * rn[1], c[2] + tube * rn[2]], nrm: rn });
        }
        rings.push(ring);
      }
      const pts = [], nrms = [];
      for (let i = 0; i < segU; i++) {
        for (let j = 0; j < segV; j++) {
          const p00 = rings[i][j], p10 = rings[i + 1][j], p11 = rings[i + 1][j + 1], p01 = rings[i][j + 1];
          for (const vtx of [p00, p10, p11, p00, p11, p01]) {
            pts.push(...vtx.pos);
            nrms.push(...vtx.nrm);
          }
        }
      }
      return { positions: new Float32Array(pts), normals: new Float32Array(nrms), vertexCount: pts.length / 3 };
    }

    const _fallbackCheck = typeof createTorusKnotMesh === "function";
    const knotMesh = _fallbackCheck ? createSeamlessTorusKnot(1.24, 0.23, 2, 3, 192, 22) : null;
    const orbitRing = createTorusMesh(2.38, 0.022, 96, 12);

    // Offscreen loupe sampler buffer to avoid self-canvas blit issues across GPU backends
    const loupeBuf = document.createElement("canvas");
    const loupeCtx = loupeBuf.getContext("2d");

    registerScene({
      width: 1920,
      height: 1080,
      fps: 60,
      totalDuration: 3.5,
      onFrame({ ctx, gl, W, H, scale, t, total }) {
        drawStageBackdrop(ctx, W, H, t, {
          accentA: "#3ad29f",
          accentB: "#ff5d7a",
          gridAlpha: 0.075,
        });
        drawDepthParticles(ctx, W, H, t, 42);

        // Split slider sweep: 18% -> 82% -> 50%
        let splitFrac;
        if (t < 0.90) {
          splitFrac = lerp(0.18, 0.82, easeInOutCubic(t / 0.90));
        } else if (t < 1.85) {
          splitFrac = lerp(0.82, 0.50, easeInOutCubic((t - 0.90) / 0.95));
        } else {
          splitFrac = 0.50;
        }
        const splitX = W * splitFrac;
        const lockFlash = Math.exp(-Math.pow((t - 2.20) * 5.6, 2)); // cues.json @ 8.20s (local 2.20s)

        // Thermal convergence: holds hot thermal aura (#ff5d7a -> #ffb454) through ~1.8s, converges cleanly to emerald (#3ad29f) at 2.20s
        const conv = easeInOutCubic(clamp01((t - 1.55) / 0.65));
        const maeVal = lerp(2.64, 0.38, easeOutCubic(clamp01((t - 0.35) / 1.85)));

        const camX = Math.sin(t * 0.55) * 0.42;
        const camY = 0.42 + Math.cos(t * 0.65) * 0.14;
        const cameraPos = [camX, camY, 6.45];
        const cameraTarget = [0, 0.02, 0];
        const fovDeg = 40;

        const knotRot = [0.42 + Math.sin(t * 0.8) * 0.22, t * 0.82 + 0.35, Math.cos(t * 0.6) * 0.15];
        const ringRot = [1.22, t * 0.35, 0.25];

        // --- PASS 1: Left ORIGINAL REF (Silver / Emerald PBR) ---
        if (gl) {
          gl.render({
            cameraPos,
            cameraTarget,
            fovDeg,
            keyColor: [0.82, 0.92, 1.0],
            fillColor: [0.23, 0.86, 0.64],
            objects: [
              {
                mesh: orbitRing,
                pos: [0, 0, 0],
                rot: ringRot,
                color: [0.55, 0.72, 0.85],
                emissive: [0.02, 0.08, 0.07],
                roughness: 0.22,
                metallic: 0.92,
                alpha: 0.72,
              },
              {
                mesh: knotMesh,
                pos: [0, 0, 0],
                rot: knotRot,
                color: [0.80, 0.88, 0.92],
                emissive: [0.02, 0.08, 0.06],
                roughness: 0.14,
                metallic: 0.94,
                alpha: 1.0,
              },
            ],
          });

          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, splitX, H);
          ctx.clip();
          ctx.drawImage(gl.canvas, 0, 0, W, H);
          ctx.restore();

          // --- PASS 2: Right 4x MAE DIFF HEATMAP (Thermal aura #ff5d7a -> #ffb454 -> #3ad29f) ---
          const heatBase = [
            lerp(0.98, 0.26, conv),
            lerp(0.36, 0.84, conv),
            lerp(0.48, 0.62, conv),
          ];
          const heatEmissive = [
            lerp(0.34, 0.05, conv),
            lerp(0.10, 0.22, conv),
            lerp(0.14, 0.14, conv),
          ];
          const heatKey = [
            lerp(1.0, 0.42, conv),
            lerp(0.58, 0.95, conv),
            lerp(0.35, 0.68, conv),
          ];
          const heatFill = [1.0, 0.71, 0.33]; // #ffb454 amber rim

          gl.render({
            cameraPos,
            cameraTarget,
            fovDeg,
            keyColor: heatKey,
            fillColor: heatFill,
            objects: [
              {
                mesh: orbitRing,
                pos: [0, 0, 0],
                rot: ringRot,
                color: [1.0, lerp(0.45, 0.75, conv), 0.38],
                emissive: [lerp(0.24, 0.04, conv), lerp(0.10, 0.14, conv), 0.08],
                roughness: 0.28,
                metallic: 0.72,
                alpha: 0.8,
              },
              {
                mesh: knotMesh,
                pos: [0, 0, 0],
                rot: knotRot,
                color: heatBase,
                emissive: heatEmissive,
                roughness: 0.26,
                metallic: 0.55,
                alpha: 1.0,
              },
            ],
          });

          ctx.save();
          ctx.beginPath();
          ctx.rect(splitX, 0, W - splitX, H);
          ctx.clip();

          // Subtle thermal aura wash behind right half
          const aura = ctx.createRadialGradient(W * 0.54, H * 0.5, 40, W * 0.54, H * 0.5, 560);
          aura.addColorStop(0, conv < 0.7 ? "rgba(255, 93, 122, 0.22)" : "rgba(58, 210, 159, 0.18)");
          aura.addColorStop(0.5, "rgba(255, 180, 84, 0.09)");
          aura.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = aura;
          ctx.fillRect(splitX, 0, W - splitX, H);

          ctx.drawImage(gl.canvas, 0, 0, W, H);

          // Crisp thermal inspection hairline grid on right diff zone
          ctx.strokeStyle = conv < 0.7 ? "rgba(255, 180, 84, 0.09)" : "rgba(58, 210, 159, 0.09)";
          ctx.lineWidth = 1;
          for (let gx = Math.floor(splitX / 48) * 48; gx < W; gx += 48) {
            ctx.beginPath();
            ctx.moveTo(gx, 80);
            ctx.lineTo(gx, H - 80);
            ctx.stroke();
          }
          ctx.restore();
        }

        // --- Vertical Laser Wipe Divider ---
        ctx.save();
        const beamGlow = ctx.createLinearGradient(splitX - 28, 0, splitX + 28, 0);
        beamGlow.addColorStop(0, "rgba(108, 140, 255, 0)");
        beamGlow.addColorStop(0.45, "rgba(108, 140, 255, 0.42)");
        beamGlow.addColorStop(0.5, "rgba(255, 255, 255, 0.95)");
        beamGlow.addColorStop(0.55, "rgba(58, 210, 159, 0.42)");
        beamGlow.addColorStop(1, "rgba(58, 210, 159, 0)");
        ctx.fillStyle = beamGlow;
        ctx.fillRect(splitX - 28, 86, 56, H - 172);

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.4;
        ctx.shadowColor = "#6c8cff";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(splitX, 86);
        ctx.lineTo(splitX, H - 86);
        ctx.stroke();

        // Split slider handle pill near bottom center of laser
        const splitPct = Math.round(splitFrac * 100);
        const handleText = `◀ SPLIT ${splitPct}% ▶`;
        ctx.font = `800 15px ${MONO_FONT}`;
        const hw = ctx.measureText(handleText).width + 34;
        drawPill(ctx, splitX - hw * 0.5, H - 142, handleText, {
          fg: "#f8fafc",
          bg: "rgba(15, 20, 34, 0.92)",
          border: "#6c8cff",
          font: `800 15px ${MONO_FONT}`,
          padX: 17,
          height: 36,
        });
        ctx.restore();

        // --- Optical Circular 2x PIXEL LOUPE ---
        // Track dynamically across the 3D surface & laser split seam, locking onto (960, 510) by t=2.18s
        let loupeX, loupeY;
        if (t < 0.75) {
          const p = easeInOutCubic(t / 0.75);
          loupeX = lerp(740, 1110, p);
          loupeY = lerp(420, 465, p);
        } else if (t < 1.50) {
          const p = easeInOutCubic((t - 0.75) / 0.75);
          loupeX = lerp(1110, 1020, p);
          loupeY = lerp(465, 530, p);
        } else if (t < 2.18) {
          const p = easeInOutCubic((t - 1.50) / 0.68);
          loupeX = lerp(1020, 960, p);
          loupeY = lerp(530, 510, p);
        } else {
          loupeX = 960;
          loupeY = 510;
        }

        const loupeR = 118;
        const sampleLogical = loupeR; // sampling loupeR x loupeR into 2*loupeR x 2*loupeR = exact 2x zoom!
        const bufPx = Math.max(4, Math.round(sampleLogical * scale));
        if (loupeBuf.width !== bufPx || loupeBuf.height !== bufPx) {
          loupeBuf.width = bufPx;
          loupeBuf.height = bufPx;
        }
        const sx = clamp01((loupeX - sampleLogical * 0.5) / W) * W * scale;
        const sy = clamp01((loupeY - sampleLogical * 0.5) / H) * H * scale;
        loupeCtx.clearRect(0, 0, bufPx, bufPx);
        loupeCtx.drawImage(ctx.canvas, sx, sy, bufPx, bufPx, 0, 0, bufPx, bufPx);

        ctx.save();
        // Loupe drop shadow
        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.arc(loupeX, loupeY, loupeR, 0, Math.PI * 2);
        ctx.fillStyle = "#06070c";
        ctx.fill();
        ctx.shadowBlur = 0;

        // Clip and draw 2x magnified buffer
        ctx.beginPath();
        ctx.arc(loupeX, loupeY, loupeR - 3, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(loupeBuf, loupeX - loupeR, loupeY - loupeR, loupeR * 2, loupeR * 2);

        // Reticle inside loupe
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(loupeX - loupeR, loupeY);
        ctx.lineTo(loupeX + loupeR, loupeY);
        ctx.moveTo(loupeX, loupeY - loupeR);
        ctx.lineTo(loupeX, loupeY + loupeR);
        ctx.stroke();
        ctx.restore();

        // Loupe metallic bezel & label
        ctx.save();
        ctx.strokeStyle = t >= 2.15 ? "#3ad29f" : "#cbd5e1";
        ctx.lineWidth = 3.5;
        ctx.shadowColor = t >= 2.15 ? "rgba(58, 210, 159, 0.65)" : "rgba(108, 140, 255, 0.45)";
        ctx.shadowBlur = 18 + 16 * lockFlash;
        ctx.beginPath();
        ctx.arc(loupeX, loupeY, loupeR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.shadowBlur = 0;
        const loupeTag = "2× PIXEL LOUPE";
        ctx.font = `800 14px ${MONO_FONT}`;
        const ltw = ctx.measureText(loupeTag).width + 28;
        drawPill(ctx, loupeX - ltw * 0.5, loupeY - loupeR - 22, loupeTag, {
          fg: "#f8fafc",
          bg: "rgba(12, 16, 28, 0.94)",
          border: t >= 2.15 ? "#3ad29f" : "#6c8cff",
          font: `800 14px ${MONO_FONT}`,
          padX: 14,
          height: 30,
        });
        ctx.restore();

        // Snap green badge "MAE 0.38 · CLEAN LOOP" at t=2.20s
        const badgeP = springProgress(t, { delay: 2.16, duration: 0.45, damping: 12, stiffness: 240 });
        if (badgeP > 0.01) {
          ctx.save();
          const txt = "✓  MAE 0.38 · CLEAN LOOP";
          ctx.font = `800 20px ${MONO_FONT}`;
          const bw = ctx.measureText(txt).width + 44;
          const bx = loupeX;
          const by = loupeY + loupeR + 38;
          ctx.translate(bx, by);
          ctx.scale(badgeP, badgeP);
          ctx.globalAlpha = clamp01(badgeP * 1.6);
          drawPill(ctx, -bw * 0.5, -24, txt, {
            fg: "#ecfdf5",
            bg: "rgba(16, 65, 50, 0.94)",
            border: "#3ad29f",
            font: `800 20px ${MONO_FONT}`,
            padX: 22,
            height: 48,
          });
          ctx.restore();
        }

        // --- Top Left & Top Right Comparison Cards ---
        const uiIn = springProgress(t, { delay: 0.04, duration: 0.52 });
        ctx.save();
        ctx.globalAlpha = clamp01(uiIn * 1.4);

        // Left: ORIGINAL REF
        drawGlassCard(ctx, 88, 98, 410, 96, {
          radius: 14,
          fill: "rgba(13, 18, 32, 0.86)",
          border: "rgba(203, 213, 225, 0.35)",
        });
        ctx.fillStyle = "#3ad29f";
        ctx.beginPath();
        ctx.arc(118, 134, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `800 24px ${UI_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("ORIGINAL REF", 136, 142);
        ctx.font = `600 15px ${MONO_FONT}`;
        ctx.fillStyle = "#94a3b8";
        ctx.fillText("1920×1080 · TREFOIL PBR", 116, 174);

        // Right: 4x MAE DIFF HEATMAP
        const rw = 460;
        const rx = W - 88 - rw;
        drawGlassCard(ctx, rx, 98, rw, 96, {
          radius: 14,
          fill: "rgba(13, 18, 32, 0.86)",
          border: conv > 0.8 ? "rgba(58, 210, 159, 0.55)" : "rgba(255, 93, 122, 0.55)",
        });
        ctx.font = `800 24px ${UI_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("4× MAE DIFF HEATMAP", rx + 24, 140);

        // Thermal scale gradient bar
        const barX = rx + 24;
        const barY = 158;
        const barW = 240;
        const tGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        tGrad.addColorStop(0, "#3ad29f");
        tGrad.addColorStop(0.5, "#ffb454");
        tGrad.addColorStop(1, "#ff5d7a");
        ctx.fillStyle = tGrad;
        ctx.fillRect(barX, barY, barW, 8);

        ctx.font = `800 18px ${MONO_FONT}`;
        ctx.fillStyle = maeVal < 0.6 ? "#3ad29f" : "#ffb454";
        ctx.fillText(`MAE ${maeVal.toFixed(2)}`, rx + 294, 168);

        // Bottom-left editorial caption
        drawPill(ctx, 88, H - 134, "02 / DUAL DIFF STAGE & OPTICAL LOUPE", {
          fg: "#cbd5e1",
          bg: "rgba(15, 20, 34, 0.82)",
          border: "rgba(148, 175, 255, 0.35)",
          font: `700 16px ${MONO_FONT}`,
          height: 38,
        });
        ctx.restore();

        drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · 03 SPLIT DIFF");
      },
    });
  </script>
</body>
</html>
