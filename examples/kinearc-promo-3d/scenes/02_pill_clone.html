<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KineArc — Morphing Pill & Card</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f7fb;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  clamp01,
  lerp,
  easeOutCubic,
  springProgress,
  roundRectPath,
  drawCraftBackdrop,
  drawBlurRevealText,
  drawPearlCard,
  drawFilmGrain,
  registerScene,
} from "./kinearc-gl3d.js";

const FONT_FAMILY = '"Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
const PROMPT_TEXT = "Match this video's vibe";
const SUMMARY_ROWS = [
  { label: "Smooth motion flow", delay: 1.68, dotColor: "#635bff" },
  { label: "Transitions & depth", delay: 1.91, dotColor: "#7c3aed" },
  { label: "Beat-synced sound", delay: 2.14, dotColor: "#ec4899" },
];

function drawSparkleStar(ctx, cx, cy, r, rot = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  const grad = ctx.createLinearGradient(-r, -r, r, r);
  grad.addColorStop(0, "#635bff");
  grad.addColorStop(0.6, "#8b5cf6");
  grad.addColorStop(1, "#ec4899");
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0);
  ctx.quadraticCurveTo(0, 0, 0, -r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

registerScene({
  totalDuration: 3.0,
  responsive: true,
  onFrame({ ctx, W, H, t }) {
    const isPortrait = H > W;
    const cx = W * 0.5;
    const cy = isPortrait ? H * 0.50 : H * 0.52;

    drawCraftBackdrop(ctx, W, H, t, {
      theme: "pearl",
      warmPool: "rgba(167, 139, 250, 0.16)",
      coolPool: "rgba(56, 189, 248, 0.12)",
      showCrosshairs: false,
    });

    // @cue 0.18 glint
    // @cue 0.50 typing duration=0.70 count=6 volume=0.58
    // @cue 1.42 swell
    // @cue 1.75 tap
    // @cue 1.98 tap
    // @cue 2.22 ping

    // Morph timing: emblem (84x84) -> horizontal pill -> vertical summary card
    const stretchRaw = springProgress(t, { delay: 0.15, duration: 0.56, damping: 15, stiffness: 185 });
    const stretchP = clamp01(stretchRaw);
    const expandRaw = springProgress(t, { delay: 1.40, duration: 0.62, damping: 16, stiffness: 165 });
    const expandP = clamp01(expandRaw);

    const emblemSize = 84;
    const pillW = isPortrait ? 760 : 720;
    const pillH = isPortrait ? 92 : 88;
    const cardW = isPortrait ? 800 : 780;
    const cardH = isPortrait ? 404 : 368;

    const w = lerp(lerp(emblemSize, pillW, stretchRaw), cardW, expandRaw);
    const h = lerp(lerp(emblemSize, pillH, clamp01(stretchP * 1.35)), cardH, expandRaw);
    const radius = lerp(lerp(emblemSize * 0.5, pillH * 0.5, stretchP), 32, expandP);

    const cardX = cx - w * 0.5;
    const pillTopY = cy - pillH * 0.5;
    const expandedTopY = cy - cardH * 0.5 + 18;
    const cardY = lerp(
      lerp(cy - emblemSize * 0.5 + Math.sin(t * 2.5) * 4, pillTopY, stretchP),
      expandedTopY,
      expandP
    );

    // Subtle header above pill/card
    const headerP = clamp01((t - 0.10) / 0.38);
    const headerY = lerp(pillTopY - 46, expandedTopY - 48, expandP);
    drawBlurRevealText(ctx, "Drop in any clip.", cx, headerY, headerP, {
      font: `600 ${isPortrait ? 34 : 30}px ${FONT_FAMILY}`,
      color: "#64748b",
      align: "center",
      maxBlur: 12,
      liftPx: 12,
    });

    // Frosted porcelain morphing container
    drawPearlCard(ctx, cardX, cardY, w, h, {
      radius,
      bg: "rgba(255, 255, 255, 0.95)",
      border: expandP > 0.2 ? "rgba(99, 91, 255, 0.18)" : "rgba(109, 93, 211, 0.16)",
      shadowColor: "rgba(65, 58, 128, 0.13)",
      shadowBlur: lerp(28, 42, expandP),
    });

    // Clip inner elements cleanly to the morphing container
    ctx.save();
    roundRectPath(ctx, cardX, cardY, w, h, radius);
    ctx.clip();

    // Parent-child anchored violet star emblem
    const starOffsetFromLeft = isPortrait ? 48 : 46;
    const starX = lerp(cx, cardX + starOffsetFromLeft, stretchP);
    const starY = cardY + pillH * 0.5;
    const starR = lerp(22, 16, stretchP);
    const starRot = lerp(t * 0.9, 0, stretchP);
    drawSparkleStar(ctx, starX, starY, starR, starRot);

    // Prompt typing inside pill header row
    if (t >= 0.44) {
      const typeProgress = clamp01((t - 0.46) / 0.80);
      const charCount = Math.floor(typeProgress * PROMPT_TEXT.length + 0.001);
      const visibleText = PROMPT_TEXT.slice(0, charCount);
      const textFadeIn = clamp01((t - 0.44) / 0.14);

      ctx.save();
      ctx.globalAlpha = textFadeIn;
      ctx.font = `600 ${isPortrait ? 32 : 30}px ${FONT_FAMILY}`;
      ctx.fillStyle = "#18181b";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      const textX = cardX + (isPortrait ? 86 : 82);
      const textY = starY + 1;
      ctx.fillText(visibleText, textX, textY);

      // Sleek caret during typing, fades cleanly as card expands
      const caretAlpha = (1 - smoothCaretFade(t)) * (0.45 + 0.55 * Math.sin(t * 14) > 0 ? 1 : 0.25);
      if (caretAlpha > 0.02) {
        const tw = ctx.measureText(visibleText).width;
        ctx.globalAlpha = caretAlpha * textFadeIn;
        ctx.fillStyle = "#635bff";
        roundRectPath(ctx, textX + tw + 4, textY - 16, 3, 32, 1.5);
        ctx.fill();
      }
      ctx.restore();
    }

    // Subtle divider + 3 check rows inside expanded summary card
    if (expandP > 0.05) {
      const divAlpha = clamp01((expandP - 0.15) / 0.5);
      ctx.save();
      ctx.globalAlpha = divAlpha;
      ctx.strokeStyle = "rgba(99, 91, 255, 0.12)";
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(cardX + 32, cardY + pillH);
      ctx.lineTo(cardX + w - 32, cardY + pillH);
      ctx.stroke();
      ctx.restore();

      const rowStartY = cardY + pillH + (isPortrait ? 58 : 52);
      const rowStep = isPortrait ? 86 : 76;
      const rowLeftX = cardX + (isPortrait ? 52 : 50);

      for (let i = 0; i < SUMMARY_ROWS.length; i++) {
        const row = SUMMARY_ROWS[i];
        const rowSp = springProgress(t, { delay: row.delay, duration: 0.42, damping: 14, stiffness: 210 });
        const rowAlpha = clamp01(rowSp * 1.4) * divAlpha;
        if (rowAlpha <= 0.01) continue;

        const ry = rowStartY + i * rowStep + (1 - rowSp) * 14;
        const dotScale = lerp(0.4, 1.0, rowSp);

        ctx.save();
        ctx.globalAlpha = rowAlpha;

        // Soft glowing violet/rose halo around dot
        ctx.fillStyle = row.dotColor;
        ctx.globalAlpha = rowAlpha * 0.16;
        ctx.beginPath();
        ctx.arc(rowLeftX, ry, 14 * dotScale, 0, Math.PI * 2);
        ctx.fill();

        // Crisp dot bullet
        ctx.globalAlpha = rowAlpha;
        ctx.fillStyle = row.dotColor;
        ctx.beginPath();
        ctx.arc(rowLeftX, ry, 6.5 * dotScale, 0, Math.PI * 2);
        ctx.fill();

        // Clean human row label
        ctx.font = `600 ${isPortrait ? 34 : 31}px ${FONT_FAMILY}`;
        ctx.fillStyle = "#18181b";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(row.label, rowLeftX + 28, ry + 1);
        ctx.restore();
      }
    }

    ctx.restore();

    drawFilmGrain(ctx, W, H, t, 0.020);
  },
});

function smoothCaretFade(t) {
  return clamp01((t - 1.38) / 0.18);
}
</script>
</body>
</html>
