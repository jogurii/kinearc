<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KineArc — Hook 3D Prism</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f7fb;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  clamp01,
  lerp,
  easeOutCubic,
  springProgress,
  createCrystalMesh,
  createTorusMesh,
  drawCraftBackdrop,
  drawBlurRevealText,
  drawFilmGrain,
  registerScene,
} from "./kinearc-gl3d.js";

const crystalMesh = createCrystalMesh(8, 0.78, 2.16, 0.28);
const ringMesh = createTorusMesh(1.44, 0.044, 72, 18);
const FONT_FAMILY = '"Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';

registerScene({
  totalDuration: 2.4,
  responsive: true,
  onFrame({ ctx, gl, W, H, t }) {
    const isPortrait = H > W;

    drawCraftBackdrop(ctx, W, H, t, {
      theme: "pearl",
      warmPool: "rgba(167, 139, 250, 0.16)",
      coolPool: "rgba(56, 189, 248, 0.12)",
      showCrosshairs: false,
    });

    // @cue 0.45 swell
    // @cue 0.85 glint
    // @cue 1.45 tap

    const settle = springProgress(t, { delay: 0.0, duration: 0.95, damping: 14, stiffness: 155 });
    const driftY = Math.sin(t * 2.2) * 0.06;
    const zSettle = lerp(-2.2, 0.0, easeOutCubic(clamp01(settle)));
    const objScale = lerp(0.72, isPortrait ? 0.92 : 1.04, settle);

    const objPos = isPortrait
      ? [0, 1.02 + driftY, zSettle]
      : [1.58, 0.05 + driftY, zSettle];

    // Soft ambient floor shadow beneath floating 3D crystal
    ctx.save();
    const shadowX = isPortrait ? W * 0.5 : W * 0.675;
    const shadowY = isPortrait ? H * 0.455 : H * 0.685;
    const shadowRx = (isPortrait ? 150 : 195) * (0.75 + 0.25 * clamp01(settle));
    const shadowRy = shadowRx * 0.22;
    const shGrad = ctx.createRadialGradient(shadowX, shadowY, 4, shadowX, shadowY, shadowRx);
    shGrad.addColorStop(0, "rgba(99, 91, 255, 0.14)");
    shGrad.addColorStop(0.55, "rgba(24, 24, 27, 0.06)");
    shGrad.addColorStop(1, "rgba(24, 24, 27, 0)");
    ctx.fillStyle = shGrad;
    ctx.beginPath();
    ctx.ellipse(shadowX, shadowY, shadowRx, shadowRy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (gl) {
      const camPos = isPortrait ? [0, 0.28, 9.6] : [0, 0.32, 6.2];
      const camTarget = isPortrait ? [0, 0.10, 0] : [0.05, 0, 0];
      gl.render({
        cameraPos: camPos,
        cameraTarget: camTarget,
        fovDeg: isPortrait ? 40 : 39,
        keyColor: [0.90, 0.88, 1.0],
        fillColor: [0.48, 0.54, 0.98],
        objects: [
          {
            mesh: crystalMesh,
            pos: objPos,
            rot: [0.24 + Math.sin(t * 1.4) * 0.06, t * 0.95 + 0.35, -0.14],
            scale: objScale,
            color: [0.42, 0.34, 0.92],
            emissive: [0.07, 0.04, 0.22],
            roughness: 0.30,
            metallic: 0.08,
          },
          {
            mesh: ringMesh,
            pos: objPos,
            rot: [Math.PI * 0.36 + t * 0.55, -0.35 + t * 1.25, 0.28],
            scale: objScale,
            color: [0.95, 0.62, 0.35],
            emissive: [0.22, 0.11, 0.04],
            roughness: 0.22,
            metallic: 0.40,
          },
        ],
      });
      ctx.drawImage(gl.canvas, 0, 0, W, H);
    }

    // Rack-focus optical typography reveal
    const meetP = clamp01((t - 0.45) / 0.36);
    const brandP = clamp01((t - 0.72) / 0.44);
    const tagP = clamp01((t - 1.25) / 0.42);

    if (isPortrait) {
      const cx = W * 0.5;
      drawBlurRevealText(ctx, "Meet", cx, H * 0.575, meetP, {
        font: `500 38px ${FONT_FAMILY}`,
        color: "#64748b",
        align: "center",
        maxBlur: 12,
        liftPx: 14,
      });
      drawBlurRevealText(ctx, "KineArc", cx, H * 0.652, brandP, {
        font: `800 116px ${FONT_FAMILY}`,
        color: "#18181b",
        align: "center",
        maxBlur: 18,
        liftPx: 20,
      });
      drawBlurRevealText(ctx, "Turn any video into editable motion.", cx, H * 0.712, tagP, {
        font: `500 32px ${FONT_FAMILY}`,
        color: "#64748b",
        align: "center",
        maxBlur: 12,
        liftPx: 12,
      });
    } else {
      const tx = W * 0.115;
      drawBlurRevealText(ctx, "Meet", tx, H * 0.395, meetP, {
        font: `500 36px ${FONT_FAMILY}`,
        color: "#64748b",
        align: "left",
        maxBlur: 12,
        liftPx: 14,
      });
      drawBlurRevealText(ctx, "KineArc", tx - 4, H * 0.515, brandP, {
        font: `800 120px ${FONT_FAMILY}`,
        color: "#18181b",
        align: "left",
        maxBlur: 18,
        liftPx: 20,
      });
      drawBlurRevealText(ctx, "Turn any video into editable motion.", tx, H * 0.592, tagP, {
        font: `500 30px ${FONT_FAMILY}`,
        color: "#64748b",
        align: "left",
        maxBlur: 12,
        liftPx: 12,
      });
    }

    drawFilmGrain(ctx, W, H, t, 0.020);
  },
});
</script>
</body>
</html>
