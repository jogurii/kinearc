<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc v3.0 — 05 Audio & 4K Engine</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import {
      registerScene,
      createBoxMesh,
      drawStageBackdrop,
      drawDepthParticles,
      drawGlassCard,
      drawPill,
      drawCornerHud,
      roundRectPath,
      springProgress,
      easeOutCubic,
      easeInOutCubic,
      smoothstep,
      clamp01,
      lerp,
    } from "./kinearc-gl3d.js";

    const UI_FONT = '"Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
    const MONO_FONT = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

    const barMesh = createBoxMesh(0.115, 1.0, 0.18);
    const baseArcBar = createBoxMesh(0.132, 0.035, 0.21);

    // Deterministic Voiceover activity envelope over [0, 3.0s]
    function voActivityAt(sec) {
      const b1 = Math.exp(-Math.pow((sec - 0.65) / 0.30, 2));
      const b2 = Math.exp(-Math.pow((sec - 1.72) / 0.44, 2));
      return clamp01(Math.max(b1 * 0.92, b2 * 1.0));
    }

    registerScene({
      width: 1920,
      height: 1080,
      fps: 60,
      totalDuration: 3.0,
      onFrame({ ctx, gl, W, H, t, total }) {
        drawStageBackdrop(ctx, W, H, t, {
          accentA: "#6c8cff",
          accentB: "#3ad29f",
          gridAlpha: 0.075,
        });
        drawDepthParticles(ctx, W, H, t, 38);

        const voNow = voActivityAt(t);
        const lockFlash = Math.exp(-Math.pow((t - 2.30) * 6.0, 2)); // cues.json @ 14.80s (local 2.30s)

        // --- 28 Animated 3D WebGL2 Metallic Bars in Symmetrical Perspective Curve ---
        if (gl) {
          const objects = [];
          const count = 28;
          const cameraPos = [1.82, 1.32, 7.85];
          const cameraTarget = [1.82, 0.18, 0];

          for (let i = 0; i < count; i++) {
            const u = (i - (count - 1) * 0.5) / ((count - 1) * 0.5); // -1 .. +1
            const d = Math.abs(u); // symmetric distance from center 0..1
            const bx = u * 2.02 - 0.16;
            const bz = -0.45 + d * d * 0.85;

            // Inner 16 bars express Voiceover peaks; outer 12 bars express Auto-Ducked BGM
            const isVoiceBand = d < 0.58;
            let barH;
            let color;
            let emissive;
            if (isVoiceBand) {
              const harmonic = 0.58 + 0.42 * Math.cos(d * 6.8 - t * 10.5) * Math.cos(t * 7.2 + d * 3.0);
              barH = 0.24 + (0.22 + voNow * 1.25) * (1 - d * 0.38) * harmonic;
              color = [lerp(0.424, 0.85, voNow * 0.6), lerp(0.549, 0.90, voNow * 0.6), 1.0];
              emissive = [0.05 * voNow, 0.08 * voNow, 0.25 * voNow];
            } else {
              // Outer BGM band visibly compresses downward when Voiceover peaks!
              const bgmWave = 0.72 + 0.28 * Math.sin(t * 6.4 + d * 5.0);
              const duckFactor = lerp(1.0, 0.30, voNow);
              barH = 0.20 + 0.88 * bgmWave * duckFactor;
              color = [0.227, 0.824, 0.624];
              emissive = [0.02, 0.14 * duckFactor, 0.10 * duckFactor];
            }

            const yCenter = -0.42 + barH * 0.5;
            objects.push({
              mesh: baseArcBar,
              pos: [bx, -0.45, bz],
              rot: [0, -u * 0.22, 0],
              color: [0.22, 0.28, 0.40],
              emissive: [0.02, 0.03, 0.06],
              roughness: 0.25,
              metallic: 0.9,
              alpha: 0.9,
            });
            objects.push({
              mesh: barMesh,
              pos: [bx, yCenter, bz],
              rot: [0, -u * 0.22, 0],
              scale: [1, barH, 1],
              color,
              emissive,
              roughness: 0.14,
              metallic: 0.92,
              alpha: 1.0,
            });
          }

          gl.render({
            cameraPos,
            cameraTarget,
            fovDeg: 38,
            keyColor: [0.76, 0.88, 1.0],
            fillColor: [0.23, 0.86, 0.64],
            objects,
          });
          ctx.drawImage(gl.canvas, 0, 0, W, H);
        }

        // --- Left Editorial Header ---
        const inP = springProgress(t, { delay: 0.03, duration: 0.52 });
        const leftX = 96;
        ctx.save();
        ctx.globalAlpha = clamp01(inP * 1.4);
        drawPill(ctx, leftX, 114, "04 / AUTO-DUCKING AUDIO & 4K WEBCODECS", {
          fg: "#a5b4fc",
          bg: "rgba(108, 140, 255, 0.14)",
          border: "rgba(108, 140, 255, 0.45)",
          font: `700 15px ${MONO_FONT}`,
          height: 36,
        });
        ctx.font = `900 48px ${UI_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("SYMMETRIC AUDIO &", leftX, 206);
        const hGrad = ctx.createLinearGradient(leftX, 215, leftX + 460, 260);
        hGrad.addColorStop(0, "#6c8cff");
        hGrad.addColorStop(1, "#3ad29f");
        ctx.fillStyle = hGrad;
        ctx.fillText("4K HARDWARE ENGINE", leftX, 258);

        // Quick legend over the 3D bars
        drawPill(ctx, leftX, 286, "● CENTER: VOICEOVER PEAKS", {
          fg: "#dbeafe",
          bg: "rgba(108, 140, 255, 0.16)",
          border: "rgba(108, 140, 255, 0.45)",
          font: `700 13px ${MONO_FONT}`,
          padX: 14,
          height: 28,
        });
        drawPill(ctx, leftX + 266, 286, "● SIDES: AUTO-DUCKED BGM", {
          fg: "#d1fae5",
          bg: "rgba(58, 210, 159, 0.14)",
          border: "rgba(58, 210, 159, 0.45)",
          font: `700 13px ${MONO_FONT}`,
          padX: 14,
          height: 28,
        });
        ctx.restore();

        // --- Left Bottom Card: Voiceover Peaks vs Auto-Ducked BGM Wave + Ducking Dip Lines ---
        const waveX = 96;
        const waveY = 696;
        const waveW = 918;
        const waveH = 268;
        drawGlassCard(ctx, waveX, waveY, waveW, waveH, {
          radius: 16,
          fill: "rgba(12, 16, 29, 0.90)",
          border: "rgba(148, 175, 255, 0.25)",
        });

        ctx.font = `800 17px ${MONO_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("SIDECHAIN AUDIO MIXER", waveX + 24, waveY + 36);
        ctx.font = `700 14px ${MONO_FONT}`;
        ctx.fillStyle = "#3ad29f";
        ctx.fillText("VO 0dB  ·  BGM AUTO-DUCK -14dB  ·  SFX CUES", waveX + 318, waveY + 36);

        const plotX = waveX + 28;
        const plotY = waveY + 60;
        const plotW = waveW - 56;
        const plotH = 178;
        roundRectPath(ctx, plotX, plotY, plotW, plotH, 10);
        ctx.fillStyle = "rgba(7, 10, 18, 0.92)";
        ctx.fill();
        ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
        ctx.stroke();

        // Reference un-ducked BGM ceiling line
        const bgmHighY = plotY + 62;
        const bgmLowY = plotY + 138;
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "rgba(255, 180, 84, 0.55)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(plotX + 8, bgmHighY);
        ctx.lineTo(plotX + plotW - 8, bgmHighY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = `700 12px ${MONO_FONT}`;
        ctx.fillStyle = "#ffb454";
        ctx.fillText("BGM NOMINAL (-4 dB)", plotX + 14, bgmHighY - 7);

        // Draw Voiceover Peaks (filled indigo area + crisp top stroke)
        const samples = 120;
        ctx.beginPath();
        ctx.moveTo(plotX, plotY + plotH);
        for (let s = 0; s <= samples; s++) {
          const frac = s / samples;
          const sec = frac * total;
          const vo = voActivityAt(sec);
          const carrier = 0.5 + 0.5 * Math.abs(Math.sin(sec * 26.0)) * Math.cos(sec * 11.0);
          const amp = vo * (0.45 + 0.55 * carrier);
          const px = plotX + frac * plotW;
          const py = plotY + plotH - 16 - amp * 138;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(plotX + plotW, plotY + plotH);
        ctx.closePath();
        ctx.fillStyle = "rgba(108, 140, 255, 0.24)";
        ctx.fill();

        ctx.beginPath();
        for (let s = 0; s <= samples; s++) {
          const frac = s / samples;
          const sec = frac * total;
          const vo = voActivityAt(sec);
          const carrier = 0.5 + 0.5 * Math.abs(Math.sin(sec * 26.0)) * Math.cos(sec * 11.0);
          const amp = vo * (0.45 + 0.55 * carrier);
          const px = plotX + frac * plotW;
          const py = plotY + plotH - 16 - amp * 138;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = "#8ba6ff";
        ctx.lineWidth = 2.4;
        ctx.stroke();

        // Draw Auto-Ducked BGM Wave (visibly dips downward underneath Voiceover bursts!)
        ctx.beginPath();
        for (let s = 0; s <= samples; s++) {
          const frac = s / samples;
          const sec = frac * total;
          const vo = voActivityAt(sec);
          const duckY = lerp(bgmHighY, bgmLowY, vo);
          const ripple = Math.sin(sec * 18.0) * lerp(10, 3, vo);
          const px = plotX + frac * plotW;
          const py = duckY + ripple;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = "#3ad29f";
        ctx.lineWidth = 3.0;
        ctx.shadowColor = "rgba(58, 210, 159, 0.5)";
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Visual Ducking Dip Lines & Arrows at Burst 1 (0.65s) and Burst 2 (1.72s)
        for (const dipSec of [0.65, 1.72]) {
          const dx = plotX + (dipSec / total) * plotW;
          ctx.strokeStyle = "#ffb454";
          ctx.lineWidth = 2.0;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(dx, bgmHighY);
          ctx.lineTo(dx, bgmLowY - 4);
          ctx.stroke();
          ctx.setLineDash([]);

          // Downward arrow head
          ctx.fillStyle = "#ffb454";
          ctx.beginPath();
          ctx.moveTo(dx, bgmLowY + 2);
          ctx.lineTo(dx - 6, bgmLowY - 8);
          ctx.lineTo(dx + 6, bgmLowY - 8);
          ctx.closePath();
          ctx.fill();

          drawPill(ctx, dx + 10, bgmLowY - 26, "-14 dB DUCK", {
            fg: "#fef3c7",
            bg: "rgba(120, 53, 15, 0.85)",
            border: "#ffb454",
            font: `800 12px ${MONO_FONT}`,
            padX: 10,
            height: 22,
          });
        }

        // Playhead scanning across waveform
        const phX = plotX + (t / total) * plotW;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(phX, plotY);
        ctx.lineTo(phX, plotY + plotH);
        ctx.stroke();
        ctx.restore();

        // --- Right Top Card: Resolution Scaling Monitor (1920x1080 -> 3840x2160 4K UHD) ---
        const monX = 1054;
        const monY = 114;
        const monW = 770;
        const monH = 556;
        drawGlassCard(ctx, monX, monY, monW, monH, {
          radius: 18,
          fill: "rgba(12, 16, 29, 0.90)",
          border: lockFlash > 0.1 ? "#3ad29f" : "rgba(148, 175, 255, 0.28)",
          glow: lockFlash > 0.1 ? "rgba(58, 210, 159, 0.35)" : null,
        });

        ctx.font = `800 18px ${MONO_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("RESOLUTION SCALING MONITOR", monX + 28, monY + 42);
        const scaleP = easeInOutCubic(clamp01((t - 0.38) / 1.55));
        const curScaleStr = lerp(1.0, 2.0, scaleP).toFixed(2);
        drawPill(ctx, monX + monW - 196, monY + 20, `?SCALE=${curScaleStr}`, {
          fg: scaleP > 0.95 ? "#ecfdf5" : "#dbeafe",
          bg: scaleP > 0.95 ? "rgba(58, 210, 159, 0.22)" : "rgba(108, 140, 255, 0.18)",
          border: scaleP > 0.95 ? "#3ad29f" : "#6c8cff",
          font: `800 15px ${MONO_FONT}`,
          padX: 16,
          height: 32,
        });

        // Monitor canvas box
        const stageX = monX + 34;
        const stageY = monY + 76;
        const stageW = monW - 68;
        const stageH = 388;

        // Inner 1920x1080 reference boundary (half dimensions of 4K boundary)
        const baseW = 330;
        const baseH = (baseW * 9) / 16; // 185.625
        const target4kW = 660;
        const target4kH = (target4kW * 9) / 16; // 371.25

        const cx = stageX + stageW * 0.5;
        const cy = stageY + stageH * 0.5;

        // Draw static inner 1920x1080 reference box
        const fhdX = cx - baseW * 0.5;
        const fhdY = cy - baseH * 0.5;
        ctx.save();
        ctx.setLineDash([7, 5]);
        ctx.strokeStyle = "rgba(148, 163, 184, 0.52)";
        ctx.lineWidth = 1.6;
        ctx.strokeRect(fhdX, fhdY, baseW, baseH);
        ctx.setLineDash([]);
        ctx.font = `700 13px ${MONO_FONT}`;
        ctx.fillStyle = "#94a3b8";
        ctx.fillText("1920×1080 BASE", fhdX + 10, fhdY + 22);

        // Draw expanding 4K frame boundary transitioning 1920x1080 -> 3840x2160 4K UHD
        const curW = lerp(baseW, target4kW, scaleP);
        const curH = lerp(baseH, target4kH, scaleP);
        const curX = cx - curW * 0.5;
        const curY = cy - curH * 0.5;

        // Subtle quadrant grid inside expanding 4K frame
        ctx.fillStyle = `rgba(58, 210, 159, ${0.05 + 0.06 * scaleP})`;
        ctx.fillRect(curX, curY, curW, curH);

        ctx.strokeStyle = `rgba(108, 140, 255, ${0.15 + 0.2 * scaleP})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, curY);
        ctx.lineTo(cx, curY + curH);
        ctx.moveTo(curX, cy);
        ctx.lineTo(curX + curW, cy);
        ctx.stroke();

        // Bright outer boundary
        ctx.strokeStyle = scaleP > 0.85 ? "#3ad29f" : "#6c8cff";
        ctx.lineWidth = 3;
        ctx.shadowColor = scaleP > 0.85 ? "rgba(58, 210, 159, 0.55)" : "rgba(108, 140, 255, 0.55)";
        ctx.shadowBlur = 16;
        ctx.strokeRect(curX, curY, curW, curH);
        ctx.shadowBlur = 0;

        // Precision corner L-ticks on expanding frame
        const tick = 18;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        for (const [lx, ly, sx, sy] of [
          [curX, curY, 1, 1],
          [curX + curW, curY, -1, 1],
          [curX, curY + curH, 1, -1],
          [curX + curW, curY + curH, -1, -1],
        ]) {
          ctx.beginPath();
          ctx.moveTo(lx + sx * tick, ly);
          ctx.lineTo(lx, ly);
          ctx.lineTo(lx, ly + sy * tick);
          ctx.stroke();
        }

        // Bold animated resolution readout footer inside monitor card
        const curResW = Math.round(lerp(1920, 3840, scaleP) / 2) * 2;
        const curResH = Math.round(lerp(1080, 2160, scaleP) / 2) * 2;
        const is4K = scaleP >= 0.96;

        ctx.font = `800 32px ${MONO_FONT}`;
        ctx.fillStyle = is4K ? "#3ad29f" : "#f8fafc";
        ctx.textAlign = "center";
        ctx.fillText(
          is4K ? "1920×1080  →  3840×2160 4K UHD" : `1920×1080  →  ${curResW}×${curResH}`,
          cx,
          monY + monH - 34
        );
        ctx.restore();

        // --- Right Bottom Card: Hardware WebCodecs Progress Bar (0% -> 100%) ---
        const wcX = 1054;
        const wcY = 696;
        const wcW = 770;
        const wcH = 268;
        const chargeP = easeInOutCubic(clamp01((t - 0.12) / 2.18)); // hits 1.00 right at t=2.30s
        const pct = Math.round(chargeP * 100);
        const isReady = pct >= 100;

        drawGlassCard(ctx, wcX, wcY, wcW, wcH, {
          radius: 16,
          fill: "rgba(12, 16, 29, 0.90)",
          border: isReady ? "#3ad29f" : "rgba(148, 175, 255, 0.25)",
          glow: isReady ? `rgba(58, 210, 159, ${0.28 + 0.32 * lockFlash})` : null,
        });

        ctx.font = `800 18px ${MONO_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText("HARDWARE WEBCODECS ENCODER", wcX + 28, wcY + 42);

        drawPill(ctx, wcX + wcW - 226, wcY + 18, "AVC L5.2 · 60 FPS", {
          fg: "#dbeafe",
          bg: "rgba(108, 140, 255, 0.18)",
          border: "#6c8cff",
          font: `800 14px ${MONO_FONT}`,
          padX: 16,
          height: 32,
        });

        // Large percentage readout
        ctx.font = `900 46px ${MONO_FONT}`;
        ctx.fillStyle = isReady ? "#3ad29f" : "#f8fafc";
        ctx.fillText(`${pct}%`, wcX + 28, wcY + 114);

        ctx.font = `700 18px ${UI_FONT}`;
        ctx.fillStyle = isReady ? "#a7f3d0" : "#94a3b8";
        ctx.fillText(
          isReady ? "ANNEX-B BITSTREAM COMPLETE  ·  MUXED AAC 48kHz" : "ENCODING ZERO-COPY VIDEOFRAME STREAM...",
          wcX + 168,
          wcY + 108
        );

        // Progress Track
        const pbX = wcX + 28;
        const pbY = wcY + 146;
        const pbW = wcW - 56;
        const pbH = 38;
        roundRectPath(ctx, pbX, pbY, pbW, pbH, 10);
        ctx.fillStyle = "#070910";
        ctx.fill();
        ctx.strokeStyle = "rgba(148, 163, 184, 0.24)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Progress Fill
        if (chargeP > 0.01) {
          const fillW = Math.max(18, (pbW - 8) * chargeP);
          roundRectPath(ctx, pbX + 4, pbY + 4, fillW, pbH - 8, 7);
          const pbGrad = ctx.createLinearGradient(pbX, 0, pbX + pbW, 0);
          pbGrad.addColorStop(0, "#6c8cff");
          pbGrad.addColorStop(0.65, "#38bdf8");
          pbGrad.addColorStop(1, "#3ad29f");
          ctx.fillStyle = pbGrad;
          ctx.shadowColor = isReady ? "rgba(58, 210, 159, 0.65)" : "rgba(108, 140, 255, 0.45)";
          ctx.shadowBlur = 14;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Spec chips below progress bar
        ctx.font = `700 14px ${MONO_FONT}`;
        ctx.fillStyle = "#64748b";
        ctx.fillText("CODEC: avc1.640034", pbX, wcY + 226);
        ctx.fillStyle = "#8ba6ff";
        ctx.fillText("CRF: 16 · BITRATE: 32 Mbps", pbX + 220, wcY + 226);
        ctx.fillStyle = "#3ad29f";
        ctx.fillText("FFMPEG COPY MUX", pbX + 518, wcY + 226);

        drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · 05 AUDIO & 4K");
      },
    });
  </script>
</body>
</html>
