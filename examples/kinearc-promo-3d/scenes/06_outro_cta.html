<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc v3.0 — 06 Outro CTA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import {
      registerScene,
      createCrystalMesh,
      createTorusMesh,
      drawStageBackdrop,
      drawDepthParticles,
      drawPill,
      drawCornerHud,
      roundRectPath,
      springProgress,
      easeOutCubic,
      smoothstep,
      clamp01,
      lerp,
      mat4,
    } from "./kinearc-gl3d.js";

    const UI_FONT = '"Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
    const MONO_FONT = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

    const corePrism = createCrystalMesh(8, 0.72, 1.72, 0.26);
    const innerPrism = createCrystalMesh(6, 0.34, 1.08, 0.24);
    const ring1 = createTorusMesh(1.16, 0.044, 72, 16);
    const ring2 = createTorusMesh(1.50, 0.048, 72, 16);
    const ring3 = createTorusMesh(1.86, 0.042, 84, 16);

    function projectToScreen(pos, vp, W, H) {
      const [x, y, z] = pos;
      const cx = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
      const cy = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
      const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15] || 1;
      return [((cx / cw) * 0.5 + 0.5) * W, (0.5 - (cy / cw) * 0.5) * H];
    }

    function drawHorizontalOpticalFlare(ctx, cx, cy, width, intensity) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";

      const halo = ctx.createRadialGradient(cx, cy, 4, cx, cy, 320);
      halo.addColorStop(0, `rgba(240, 248, 255, ${0.42 * intensity})`);
      halo.addColorStop(0.28, `rgba(108, 140, 255, ${0.28 * intensity})`);
      halo.addColorStop(0.6, `rgba(58, 210, 159, ${0.12 * intensity})`);
      halo.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, 320, 0, Math.PI * 2);
      ctx.fill();

      const halfW = width * 0.5;
      const streak = ctx.createLinearGradient(cx - halfW, cy, cx + halfW, cy);
      streak.addColorStop(0, "rgba(108, 140, 255, 0)");
      streak.addColorStop(0.20, `rgba(108, 140, 255, ${0.28 * intensity})`);
      streak.addColorStop(0.42, `rgba(58, 210, 159, ${0.65 * intensity})`);
      streak.addColorStop(0.50, `rgba(255, 255, 255, ${0.98 * intensity})`);
      streak.addColorStop(0.58, `rgba(139, 166, 255, ${0.65 * intensity})`);
      streak.addColorStop(0.80, `rgba(108, 140, 255, ${0.28 * intensity})`);
      streak.addColorStop(1, "rgba(108, 140, 255, 0)");
      ctx.fillStyle = streak;
      ctx.fillRect(cx - halfW, cy - 2.5, width, 5);

      const coreW = width * 0.45;
      const coreGrad = ctx.createLinearGradient(cx - coreW * 0.5, cy, cx + coreW * 0.5, cy);
      coreGrad.addColorStop(0, "rgba(255,255,255,0)");
      coreGrad.addColorStop(0.5, `rgba(255,255,255,${0.92 * intensity})`);
      coreGrad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = coreGrad;
      ctx.fillRect(cx - coreW * 0.5, cy - 1, coreW, 2);

      ctx.restore();
    }

    registerScene({
      width: 1920,
      height: 1080,
      fps: 60,
      totalDuration: 2.5,
      onFrame({ ctx, gl, W, H, t, total }) {
        drawStageBackdrop(ctx, W, H, t, {
          accentA: "#6c8cff",
          accentB: "#3ad29f",
          gridAlpha: 0.08,
        });
        drawDepthParticles(ctx, W, H, t, 50);

        // Spring lock right on cue (chord_hit at 0.05s)
        const lockP = springProgress(t, { delay: 0.0, duration: 0.65, damping: 13, stiffness: 210 });
        const chordPulse = Math.exp(-Math.pow((t - 0.14) * 4.5, 2));

        // Position 3D emblem cleanly in upper-center so bold lockup & CLI pill sit cleanly below
        const cameraPos = [0, 0.28, 7.05];
        const cameraTarget = [0, -1.12, 0];
        const fovDeg = 38;
        const proj = mat4.perspective((fovDeg * Math.PI) / 180, W / H, 0.1, 80);
        const view = mat4.lookAt(cameraPos, cameraTarget);
        const vp = mat4.multiply(proj, view);
        const [coreX, coreY] = projectToScreen([0, 0, 0], vp, W, H);

        // Background optical flare behind crystal core
        drawHorizontalOpticalFlare(ctx, coreX, coreY, 1520 * (0.45 + 0.55 * clamp01(lockP)), 0.72 + 0.45 * chordPulse);

        if (gl) {
          const rScale1 = lerp(1.42, 0.78, lockP);
          const rScale2 = lerp(1.56, 0.78, springProgress(t, { delay: 0.04, duration: 0.68, damping: 14, stiffness: 200 }));
          const rScale3 = lerp(1.70, 0.78, springProgress(t, { delay: 0.08, duration: 0.72, damping: 14, stiffness: 195 }));
          const coreScale = lerp(0.40, 0.82, lockP);

          const openTilt = (1 - lockP) * 0.95;

          gl.render({
            cameraPos,
            cameraTarget,
            fovDeg,
            keyColor: [0.78, 0.88, 1.0],
            fillColor: [0.23, 0.86, 0.64],
            objects: [
              {
                mesh: innerPrism,
                pos: [0, 0, 0],
                rot: [0.1, -t * 1.2, 0],
                scale: coreScale,
                color: [0.227, 0.824, 0.624],
                emissive: [0.08 + 0.10 * chordPulse, 0.32 + 0.25 * chordPulse, 0.24 + 0.18 * chordPulse],
                roughness: 0.12,
                metallic: 0.86,
                alpha: 1.0,
              },
              {
                mesh: ring1,
                pos: [0, 0, 0],
                rot: [0.55 + openTilt + t * 0.75, 0.25 - t * 0.65, t * 0.42],
                scale: rScale1,
                color: [0.227, 0.824, 0.624],
                emissive: [0.03, 0.15, 0.10],
                roughness: 0.15,
                metallic: 0.92,
                alpha: 1.0,
              },
              {
                mesh: ring2,
                pos: [0, 0, 0],
                rot: [-0.42 - openTilt - t * 0.58, 0.62 + t * 0.72, -t * 0.35],
                scale: rScale2,
                color: [0.424, 0.549, 1.0],
                emissive: [0.05, 0.08, 0.24],
                roughness: 0.14,
                metallic: 0.93,
                alpha: 1.0,
              },
              {
                mesh: ring3,
                pos: [0, 0, 0],
                rot: [1.05 + openTilt * 0.8 + t * 0.44, -0.35 - t * 0.52, 0.22 + t * 0.28],
                scale: rScale3,
                color: [0.796, 0.835, 0.882],
                emissive: [0.03, 0.04, 0.06],
                roughness: 0.18,
                metallic: 0.96,
                alpha: 1.0,
              },
              {
                mesh: corePrism,
                pos: [0, 0, 0],
                rot: [0.12, t * 0.88, -0.04],
                scale: coreScale,
                color: [0.62, 0.76, 1.0],
                emissive: [0.06 + 0.08 * chordPulse, 0.10 + 0.10 * chordPulse, 0.22 + 0.14 * chordPulse],
                roughness: 0.08,
                metallic: 0.94,
                alpha: 0.68,
              },
            ],
          });
          ctx.drawImage(gl.canvas, 0, 0, W, H);
        }

        // Crisp foreground optical flare across equator
        drawHorizontalOpticalFlare(ctx, coreX, coreY, 1280, 0.38 + 0.42 * chordPulse);

        // --- Bold Lockup: kinearc v3.0 ---
        const titleP = springProgress(t, { delay: 0.12, duration: 0.58, damping: 14, stiffness: 190 });
        const tagP = springProgress(t, { delay: 0.24, duration: 0.55, damping: 15, stiffness: 180 });
        const pillP = springProgress(t, { delay: 0.36, duration: 0.55, damping: 14, stiffness: 185 });

        const cx = W * 0.5;
        ctx.save();
        ctx.globalAlpha = clamp01(titleP * 1.5);
        const titleY = lerp(716, 682, titleP);

        ctx.font = `900 108px ${UI_FONT}`;
        const brandTxt = "kinearc";
        const verTxt = "v3.0";
        const brandW = ctx.measureText(brandTxt).width;
        ctx.font = `900 54px ${MONO_FONT}`;
        const verW = ctx.measureText(verTxt).width + 44;
        const gap = 24;
        const totalW = brandW + gap + verW;
        const startX = cx - totalW * 0.5;

        // "kinearc" wordmark
        ctx.font = `900 108px ${UI_FONT}`;
        const wordGrad = ctx.createLinearGradient(startX, titleY - 90, startX + brandW, titleY + 10);
        wordGrad.addColorStop(0, "#ffffff");
        wordGrad.addColorStop(0.7, "#e2e8f0");
        wordGrad.addColorStop(1, "#a5b4fc");
        ctx.fillStyle = wordGrad;
        ctx.shadowColor = "rgba(108, 140, 255, 0.42)";
        ctx.shadowBlur = 28;
        ctx.fillText(brandTxt, startX, titleY);
        ctx.shadowBlur = 0;

        // "v3.0" pill badge aligned cleanly beside wordmark
        const verX = startX + brandW + gap;
        const verY = titleY - 62;
        roundRectPath(ctx, verX, verY, verW, 64, 16);
        const vBg = ctx.createLinearGradient(verX, verY, verX + verW, verY + 64);
        vBg.addColorStop(0, "rgba(108, 140, 255, 0.26)");
        vBg.addColorStop(1, "rgba(58, 210, 159, 0.26)");
        ctx.fillStyle = vBg;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#3ad29f";
        ctx.shadowColor = "rgba(58, 210, 159, 0.45)";
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.font = `900 44px ${MONO_FONT}`;
        ctx.fillStyle = "#ecfdf5";
        ctx.textBaseline = "middle";
        ctx.fillText(verTxt, verX + 22, verY + 34);
        ctx.textBaseline = "alphabetic";
        ctx.restore();

        // --- Tagline: Programmatic 4K Motion & 1:1 Video Cloning Engine ---
        ctx.save();
        ctx.globalAlpha = clamp01(tagP * 1.4);
        const tagY = lerp(772, 748, tagP);
        ctx.font = `600 32px ${UI_FONT}`;
        ctx.fillStyle = "#cbd5e1";
        ctx.textAlign = "center";
        ctx.fillText("Programmatic 4K Motion & 1:1 Video Cloning Engine", cx, tagY);
        ctx.restore();

        // --- Glowing Terminal Command Pill: python scripts/kinearc_cli.py doctor --strict ---
        ctx.save();
        ctx.globalAlpha = clamp01(pillP * 1.4);
        const cmdText = "python scripts/kinearc_cli.py doctor --strict";
        const promptText = "$  ";
        ctx.font = `700 24px ${MONO_FONT}`;
        const promptW = ctx.measureText(promptText).width;
        const cmdW = ctx.measureText(cmdText).width;
        const pillW = promptW + cmdW + 76;
        const pillH = 72;
        const pillX = cx - pillW * 0.5;
        const pillY = lerp(838, 796, pillP);

        // Outer ambient bloom
        ctx.shadowColor = "rgba(58, 210, 159, 0.42)";
        ctx.shadowBlur = 32;
        roundRectPath(ctx, pillX, pillY, pillW, pillH, 36);
        ctx.fillStyle = "rgba(10, 15, 28, 0.94)";
        ctx.fill();
        ctx.shadowBlur = 0;

        // Animated gradient border
        const borderGrad = ctx.createLinearGradient(pillX, pillY, pillX + pillW, pillY);
        borderGrad.addColorStop(0, "#6c8cff");
        borderGrad.addColorStop(0.5, "#3ad29f");
        borderGrad.addColorStop(1, "#6c8cff");
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = borderGrad;
        ctx.stroke();

        // Specular glint sweep across terminal pill
        ctx.save();
        roundRectPath(ctx, pillX, pillY, pillW, pillH, 36);
        ctx.clip();
        const sweepP = clamp01((t - 0.55) / 1.15);
        if (sweepP > 0 && sweepP < 1) {
          const sx = lerp(pillX - 180, pillX + pillW + 180, sweepP);
          const sg = ctx.createLinearGradient(sx - 90, 0, sx + 90, 0);
          sg.addColorStop(0, "rgba(255,255,255,0)");
          sg.addColorStop(0.5, "rgba(255,255,255,0.16)");
          sg.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = sg;
          ctx.fillRect(sx - 90, pillY, 180, pillH);
        }
        ctx.restore();

        // Terminal text
        ctx.font = `800 24px ${MONO_FONT}`;
        ctx.fillStyle = "#3ad29f";
        ctx.textBaseline = "middle";
        ctx.fillText(promptText, pillX + 38, pillY + pillH * 0.5 + 1);
        ctx.font = `700 24px ${MONO_FONT}`;
        ctx.fillStyle = "#f8fafc";
        ctx.fillText(cmdText, pillX + 38 + promptW, pillY + pillH * 0.5 + 1);
        ctx.restore();

        // Subtle footer capability chips
        ctx.save();
        ctx.globalAlpha = clamp01((pillP - 0.2) * 1.4);
        const chips = [
          "CV MOTION CAPTURE",
          "DUAL DIFF WORKBENCH",
          "AUTO-DUCK AUDIO",
          "4K 60FPS WEBCODECS",
        ];
        ctx.font = `700 13px ${MONO_FONT}`;
        const chipGap = 16;
        const chipWidths = chips.map((c) => ctx.measureText(c).width + 28);
        const rowW = chipWidths.reduce((a, b) => a + b, 0) + chipGap * (chips.length - 1);
        let curChipX = cx - rowW * 0.5;
        chips.forEach((txt, idx) => {
          const w = drawPill(ctx, curChipX, 902, txt, {
            fg: "#94a3b8",
            bg: "rgba(15, 20, 34, 0.72)",
            border: "rgba(148, 175, 255, 0.22)",
            font: `700 13px ${MONO_FONT}`,
            padX: 14,
            height: 30,
          });
          curChipX += w + chipGap;
        });
        ctx.restore();

        drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · 06 LAUNCH");
      },
    });
  </script>
</body>
</html>
