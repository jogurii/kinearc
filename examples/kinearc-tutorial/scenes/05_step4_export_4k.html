<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc Walkthrough — Step 04: One-Click 4K Export & Setup</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  registerScene,
  createCrystalMesh,
  createTorusMesh,
  drawStageBackdrop,
  drawDepthParticles,
  drawGlassCard,
  drawPill,
  drawCornerHud,
  springProgress,
  easeOutCubic,
  easeInOutCubic,
  smoothstep,
  clamp01,
  lerp,
  roundRectPath,
} from "./kinearc-gl3d.js";

const TOTAL = 6.0;
const heroCrystal = createCrystalMesh(8, 1.15, 2.55, 0.25);
const ringA = createTorusMesh(1.92, 0.05, 72, 16);
const ringB = createTorusMesh(2.38, 0.036, 72, 16);

const SANS = 'Inter, "Segoe UI", system-ui, -apple-system, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

const STEPS = [
  "00 WHY KINEARC",
  "01 EXTRACT",
  "02 AUTHOR 3D",
  "03 WORKBENCH",
  "04 EXPORT 4K",
];

function drawStepRail(ctx, W, y, activeIdx) {
  ctx.save();
  const totalW = 1180;
  const gap = 14;
  const pillW = (totalW - gap * (STEPS.length - 1)) / STEPS.length;
  const startX = (W - totalW) * 0.5;
  for (let i = 0; i < STEPS.length; i++) {
    const x = startX + i * (pillW + gap);
    const active = i === activeIdx;
    roundRectPath(ctx, x, y, pillW, 38, 19);
    ctx.fillStyle = active ? "rgba(58, 210, 159, 0.22)" : "rgba(15, 20, 34, 0.72)";
    ctx.fill();
    ctx.lineWidth = active ? 1.8 : 1.1;
    ctx.strokeStyle = active ? "rgba(58, 210, 159, 0.80)" : "rgba(148, 163, 184, 0.22)";
    ctx.stroke();

    ctx.font = `700 13px ${MONO}`;
    ctx.fillStyle = active ? "#ecfdf5" : "rgba(148, 163, 184, 0.68)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(STEPS[i], x + pillW * 0.5, y + 19.5);
  }
  ctx.restore();
}

function drawCursor(ctx, x, y, clicking = 0) {
  ctx.save();
  if (clicking > 0) {
    const r = 10 + (1 - clicking) * 26;
    ctx.strokeStyle = `rgba(58, 210, 159, ${clicking})`;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.translate(x, y);
  ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 24);
  ctx.lineTo(6.5, 18.5);
  ctx.lineTo(11.5, 29);
  ctx.lineTo(15.2, 27.2);
  ctx.lineTo(10.2, 17);
  ctx.lineTo(18.5, 16.5);
  ctx.closePath();
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = "#0b0d13";
  ctx.stroke();
  ctx.restore();
}

function drawUiButton(ctx, x, y, w, h, label, {
  bg = "#191d2b",
  border = "#262b3d",
  fg = "#eceff7",
  glow = null,
  font = `700 13px ${SANS}`,
} = {}) {
  ctx.save();
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 22;
  }
  roundRectPath(ctx, x, y, w, h, 8);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = border;
  ctx.stroke();
  ctx.font = font;
  ctx.fillStyle = fg;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w * 0.5, y + h * 0.5 + 0.5);
  ctx.restore();
}

registerScene({
  width: 1920,
  height: 1080,
  fps: 60,
  totalDuration: TOTAL,
  onFrame({ ctx, gl, W, H, t, total }) {
    drawStageBackdrop(ctx, W, H, t, {
      accentA: "#3ad29f",
      accentB: "#6c8cff",
      gridAlpha: 0.075,
    });
    drawDepthParticles(ctx, W, H, t, 54);

    const enterP = easeOutCubic(clamp01(t / 0.40));
    const phaseSwap = smoothstep(3.32, 3.72, t); // 0 in Phase A, 1 in Phase B
    const phaseAAlpha = 1 - phaseSwap;
    const phaseBAlpha = phaseSwap;
    const lockBeat = springProgress(t, { delay: 2.80, duration: 0.5, damping: 14, stiffness: 200 });
    const chordBeat = springProgress(t, { delay: 4.00, duration: 0.6, damping: 13, stiffness: 185 });

    // WebGL2 3D Hero Geometry
    if (gl) {
      const cScale = lerp(0.84, 0.92, phaseSwap) * (1 + 0.05 * chordBeat * (1 - clamp01((t - 4.5) / 1.0)));
      const rScale = lerp(0.82, 0.92, phaseSwap);
      gl.render({
        cameraPos: [Math.sin(t * 0.42) * 0.45, 0.25, 6.8],
        cameraTarget: [0, 0, 0],
        fovDeg: 40,
        keyColor: [0.55, 0.80, 1.0],
        fillColor: [0.22, 0.82, 0.62],
        objects: [
          {
            mesh: heroCrystal,
            pos: [0, lerp(0.0, -0.18, phaseSwap), 0],
            rot: [0.20 + Math.sin(t * 0.7) * 0.08, t * 0.7, 0.12],
            scale: cScale,
            color: [0.22, 0.68, 0.58],
            emissive: [0.03, 0.09 + 0.06 * chordBeat, 0.14],
            roughness: 0.22,
            metallic: 0.86,
            alpha: 0.94,
          },
          {
            mesh: ringA,
            pos: [0, lerp(0.0, -0.18, phaseSwap), 0],
            rot: [1.08, t * 0.58, 0.35],
            scale: rScale,
            color: [0.40, 0.56, 0.98],
            emissive: [0.05, 0.09, 0.20],
            roughness: 0.24,
            metallic: 0.86,
            alpha: 0.86,
          },
          {
            mesh: ringB,
            pos: [0, lerp(0.0, -0.18, phaseSwap), 0],
            rot: [-0.72, -t * 0.42, 0.8],
            scale: rScale,
            color: [0.95, 0.66, 0.32],
            emissive: [0.10, 0.05, 0.02],
            roughness: 0.26,
            metallic: 0.84,
            alpha: 0.76,
          },
        ],
      });
      if (phaseBAlpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = phaseBAlpha;
        ctx.drawImage(gl.canvas, 0, 0, W, H);
        ctx.restore();
      }
    }

    // Header
    ctx.save();
    ctx.globalAlpha *= enterP;
    drawPill(ctx, 96, 84, "STEP 04 · ONE-CLICK 4K EXPORT & SETUP", {
      fg: "#6ee7b7",
      bg: "rgba(58, 210, 159, 0.16)",
      border: "rgba(58, 210, 159, 0.58)",
      font: `700 16px ${MONO}`,
      padX: 18,
      height: 36,
    });
    ctx.font = `800 44px ${SANS}`;
    ctx.fillStyle = "#f1f5f9";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(
      phaseSwap < 0.5 ? "Render 4K 60fps & Auto-Ducked Audio in One Click" : "Ready Across Every Major Coding Agent",
      96,
      170
    );
    ctx.font = `500 20px ${SANS}`;
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(
      phaseSwap < 0.5
        ? "WebCodecs + FFmpeg audio_mix.py exports crisp 3840×2160 MP4 straight from the Drawer"
        : "Install once and build broadcast-grade 2D, 3D, and interactive web motion anywhere",
      96,
      203
    );
    ctx.restore();

    // =========================================================================
    // PHASE A: Drawer "Audio & Out" -> Export 4K 60fps charging to 100%
    // =========================================================================
    if (phaseAAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha *= phaseAAlpha;
      const scA = 1 - phaseSwap * 0.04;
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(scA, scA);
      ctx.translate(-W * 0.5, -H * 0.5);

      const stX = 96, stY = 232, stW = 1080, stH = 668;
      const drX = 1206, drY = 232, drW = 618, drH = 668;

      const exportClicked = t >= 0.72;
      const exportProg = clamp01((t - 0.80) / 2.00); // 0% at 0.80s -> 100% at 2.80s!
      const exportDone = t >= 2.80;
      const exportFrames = Math.round(exportProg * 1800);

      // Left: 4K Output Preview & Audio Mix Monitor
      drawGlassCard(ctx, stX, stY, stW, stH, {
        radius: 18,
        fill: "#0b0e17",
        border: exportDone ? "rgba(58, 210, 159, 0.56)" : "rgba(108, 140, 255, 0.38)",
        glow: exportDone ? "rgba(58, 210, 159, 0.16)" : "rgba(108, 140, 255, 0.14)",
      });

      // Preview header bar
      roundRectPath(ctx, stX + 1, stY + 1, stW - 2, 48, 17);
      ctx.fillStyle = "#12151f";
      ctx.fill();

      drawPill(ctx, stX + 20, stY + 11, "MASTER OUTPUT MONITOR", {
        fg: "#c7d6ff",
        bg: "rgba(108, 140, 255, 0.16)",
        border: "rgba(108, 140, 255, 0.45)",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });

      drawPill(ctx, stX + stW - 356, stY + 11, "3840×2160 · 60fps · Audio Auto-Ducked", {
        fg: exportDone ? "#6ee7b7" : "#fde68a",
        bg: exportDone ? "rgba(58, 210, 159, 0.16)" : "rgba(255, 180, 84, 0.14)",
        border: exportDone ? "rgba(58, 210, 159, 0.60)" : "rgba(255, 180, 84, 0.45)",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });

      // 3D Stage viewport inside monitor
      const mvX = stX + 24, mvY = stY + 66, mvW = stW - 48, mvH = 442;
      roundRectPath(ctx, mvX, mvY, mvW, mvH, 14);
      ctx.fillStyle = "#070912";
      ctx.fill();
      ctx.strokeStyle = "#262b3d";
      ctx.stroke();

      if (gl) {
        ctx.save();
        roundRectPath(ctx, mvX + 1, mvY + 1, mvW - 2, mvH - 2, 13);
        ctx.clip();
        const dh = mvH * 0.86;
        const dw = dh * (W / H);
        ctx.drawImage(gl.canvas, mvX + mvW * 0.5 - dw * 0.5, mvY + mvH * 0.48 - dh * 0.5, dw, dh);
        ctx.restore();
      }

      if (exportDone) {
        const badgeText = "✓ 4K MASTER READY · out/kinearc-tutorial-4k.mp4";
        ctx.font = `700 13px ${MONO}`;
        const bw = ctx.measureText(badgeText).width + 32;
        drawPill(ctx, mvX + mvW * 0.5 - bw * 0.5, mvY + mvH - 48, badgeText, {
          fg: "#ecfdf5",
          bg: "rgba(12, 34, 29, 0.92)",
          border: "#3ad29f",
          font: `700 13px ${MONO}`,
          padX: 16,
          height: 32,
        });
      }

      // Auto-Ducked Audio Track Strip at bottom of left panel
      const audY = stY + 528;
      roundRectPath(ctx, stX + 24, audY, stW - 48, 118, 12);
      ctx.fillStyle = "#12151f";
      ctx.fill();
      ctx.strokeStyle = "#262b3d";
      ctx.stroke();

      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = "#8b93ad";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("AUDIO MIX · BGM (0.42× AUTO-DUCKED) + 11 SFX CUES · 48kHz STEREO AAC", stX + 42, audY + 28);

      // Stereo Waveform + SFX markers
      const wfX = stX + 42, wfY = audY + 46, wfW = stW - 84, wfH = 52;
      for (let i = 0; i < 86; i++) {
        const bx = wfX + (i / 86) * wfW;
        const active = (i / 86) <= (exportDone ? 1 : exportProg);
        const hBar = 6 + Math.abs(Math.sin(i * 0.38 + t * 1.4) * Math.cos(i * 0.21)) * 20;
        ctx.fillStyle = active ? "rgba(58, 210, 159, 0.78)" : "rgba(108, 140, 255, 0.28)";
        ctx.fillRect(bx, wfY + wfH * 0.5 - hBar, 7, hBar * 2);
      }

      // Right: Workbench Drawer open on "Audio & Out"
      drawGlassCard(ctx, drX, drY, drW, drH, {
        radius: 18,
        fill: "#12151f",
        border: exportDone ? "rgba(58, 210, 159, 0.58)" : "rgba(108, 140, 255, 0.42)",
        glow: "rgba(0, 0, 0, 0.55)",
      });

      // Drawer Tab Bar: Notes | QA | Audio & Out (active)
      const dTabs = ["Notes", "QA", "Audio & Out"];
      const tabW = drW / 3;
      for (let i = 0; i < 3; i++) {
        const tx = drX + i * tabW;
        const act = i === 2;
        ctx.fillStyle = act ? "#191d2b" : "#12151f";
        ctx.fillRect(tx + (i === 0 ? 2 : 0), drY + 2, tabW - (i === 2 ? 2 : 0), 46);
        if (act) {
          ctx.fillStyle = "#3ad29f";
          ctx.fillRect(tx, drY + 45, tabW - 2, 3);
        }
        ctx.font = `700 14px ${SANS}`;
        ctx.fillStyle = act ? "#eceff7" : "#8b93ad";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(dTabs[i], tx + tabW * 0.5, drY + 25);
      }
      ctx.textAlign = "left";

      // Section 1: Audio Finishing
      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = "#8b93ad";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("AUDIO FINISHING", drX + 24, drY + 78);

      const afCardY = drY + 90;
      roundRectPath(ctx, drX + 24, afCardY, drW - 48, 174, 12);
      ctx.fillStyle = "#191d2b";
      ctx.fill();
      ctx.strokeStyle = "#262b3d";
      ctx.stroke();

      // Chips row: Voice | BGM | SFX | Video
      const chips = [
        { lbl: "Voice", ready: false },
        { lbl: "BGM", ready: true },
        { lbl: "SFX", ready: true },
        { lbl: "Video", ready: true },
      ];
      let chx = drX + 42;
      for (const ch of chips) {
        const cw = drawPill(ctx, chx, afCardY + 18, ch.lbl, {
          fg: ch.ready ? "#6ee7b7" : "#64748b",
          bg: ch.ready ? "rgba(58, 210, 159, 0.15)" : "rgba(30, 41, 59, 0.45)",
          border: ch.ready ? "rgba(58, 210, 159, 0.52)" : "rgba(148, 163, 184, 0.20)",
          font: `700 12px ${MONO}`,
          padX: 14,
          height: 28,
        });
        chx += cw + 10;
      }

      // Slider previews
      ctx.font = `600 13px ${SANS}`;
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("BGM Duck Volume", drX + 42, afCardY + 74);
      ctx.font = `700 13px ${MONO}`;
      ctx.fillStyle = "#6ee7b7";
      ctx.textAlign = "right";
      ctx.fillText("0.42×", drX + drW - 42, afCardY + 74);
      ctx.textAlign = "left";

      roundRectPath(ctx, drX + 42, afCardY + 86, drW - 84, 8, 4);
      ctx.fillStyle = "#0b0d13";
      ctx.fill();
      roundRectPath(ctx, drX + 42, afCardY + 86, (drW - 84) * 0.42, 8, 4);
      ctx.fillStyle = "#6c8cff";
      ctx.fill();

      ctx.font = `600 13px ${SANS}`;
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("BGM Fade-out (s)", drX + 42, afCardY + 124);
      ctx.font = `700 13px ${MONO}`;
      ctx.fillStyle = "#b7c8ff";
      ctx.textAlign = "right";
      ctx.fillText("1.6s", drX + drW - 42, afCardY + 124);
      ctx.textAlign = "left";

      drawUiButton(ctx, drX + 42, afCardY + 136, drW - 84, 28, "Auto-Duck Mix (audio_mix)", {
        bg: "rgba(108, 140, 255, 0.16)",
        border: "rgba(108, 140, 255, 0.45)",
        fg: "#c7d6ff",
        font: `700 12px ${SANS}`,
      });

      // Section 2: Render & Export
      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = "#8b93ad";
      ctx.fillText("RENDER & EXPORT", drX + 24, drY + 292);

      const exCardY = drY + 304;
      roundRectPath(ctx, drX + 24, exCardY, drW - 48, 342, 12);
      ctx.fillStyle = "#191d2b";
      ctx.fill();
      ctx.strokeStyle = "#262b3d";
      ctx.stroke();

      drawUiButton(ctx, drX + 42, exCardY + 20, drW - 84, 38, "Render Still", {
        bg: "#12151f",
        border: "#2d354c",
        fg: "#cbd5e1",
      });
      drawUiButton(ctx, drX + 42, exCardY + 68, drW - 84, 38, "Export 1080p 60fps", {
        bg: "#12151f",
        border: "#2d354c",
        fg: "#cbd5e1",
      });

      const btn4kX = drX + 42, btn4kY = exCardY + 116, btn4kW = drW - 84, btn4kH = 44;
      drawUiButton(ctx, btn4kX, btn4kY, btn4kW, btn4kH, "Export 4K 60fps", {
        bg: exportDone ? "#22a87b" : (exportClicked ? "#5476f7" : "#6c8cff"),
        border: exportDone ? "#3ad29f" : "#9db3ff",
        fg: "#ffffff",
        glow: exportClicked ? "rgba(58, 210, 159, 0.55)" : "rgba(108, 140, 255, 0.55)",
        font: `800 15px ${SANS}`,
      });

      // Live Progress Bar
      const progY = exCardY + 182;
      roundRectPath(ctx, drX + 42, progY, drW - 84, 14, 7);
      ctx.fillStyle = "#0b0d13";
      ctx.fill();
      ctx.strokeStyle = "#262b3d";
      ctx.stroke();

      if (exportProg > 0) {
        const fillW = Math.max(14, (drW - 84) * exportProg);
        const pgGrad = ctx.createLinearGradient(drX + 42, 0, drX + drW - 42, 0);
        pgGrad.addColorStop(0, "#6c8cff");
        pgGrad.addColorStop(1, "#3ad29f");
        roundRectPath(ctx, drX + 42, progY, fillW, 14, 7);
        ctx.fillStyle = pgGrad;
        ctx.fill();
      }

      const pctInt = Math.round(exportProg * 100);
      ctx.font = `700 13px ${MONO}`;
      ctx.fillStyle = exportDone ? "#6ee7b7" : "#eceff7";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(
        exportDone
          ? `100% · 3840×2160 · 60fps · Audio Auto-Ducked`
          : (exportClicked ? `Rendering frame ${exportFrames}/1800 (${pctInt}%)...` : "Ready for 4K 60fps export (--scale 2)"),
        drX + 42,
        progY + 38
      );

      // Output spec box
      roundRectPath(ctx, drX + 42, progY + 56, drW - 84, 86, 10);
      ctx.fillStyle = "#0b0d13";
      ctx.fill();
      ctx.strokeStyle = exportDone ? "rgba(58, 210, 159, 0.48)" : "#262b3d";
      ctx.stroke();

      ctx.font = `600 12.5px ${MONO}`;
      ctx.fillStyle = exportDone ? "#6ee7b7" : "#94a3b8";
      ctx.fillText("3840×2160 · 60fps · Audio Auto-Ducked", drX + 58, progY + 84);
      ctx.fillStyle = "#b7c8ff";
      ctx.fillText("kinearc_cli.py render --scale 2 --crf 16", drX + 58, progY + 108);
      ctx.fillStyle = exportDone ? "#3ad29f" : "#64748b";
      ctx.fillText(exportDone ? "✓ Complete -> Open in Stage / Diff" : "WebCodecs H.264 + FFmpeg AAC Mix", drX + 58, progY + 130);

      // Animated Cursor clicking Export 4K 60fps
      if (t < 1.55) {
        const startC = [drX + 120, drY + 140];
        const targetC = [btn4kX + btn4kW * 0.56, btn4kY + btn4kH * 0.5];
        const moveU = easeInOutCubic(clamp01((t - 0.18) / 0.50));
        const cx = lerp(startC[0], targetC[0], moveU);
        const cy = lerp(startC[1], targetC[1], moveU);
        const clickPulse = exportClicked ? clamp01(1 - (t - 0.72) / 0.35) : 0;
        drawCursor(ctx, cx, cy, clickPulse);
      }

      ctx.restore();
    }

    // =========================================================================
    // PHASE B: Clean Final Summary Card — "kinearc v3.0 — Ready to Use"
    // =========================================================================
    if (phaseBAlpha > 0.01) {
      const cardPop = springProgress(t, { delay: 3.45, duration: 0.65, damping: 14, stiffness: 170 });
      ctx.save();
      ctx.globalAlpha *= phaseBAlpha;
      const scB = lerp(0.92, 1.0, cardPop);
      ctx.translate(W * 0.5, H * 0.54);
      ctx.scale(scB, scB);
      ctx.translate(-W * 0.5, -H * 0.54);

      const cw = 1360, ch = 588;
      const cx = (W - cw) * 0.5;
      const cy = 264;

      drawGlassCard(ctx, cx, cy, cw, ch, {
        radius: 24,
        fill: "rgba(10, 15, 28, 0.86)",
        border: "rgba(58, 210, 159, 0.55)",
        glow: "rgba(58, 210, 159, 0.22)",
      });

      // Top centered pill
      const topBadge = "INSTALL ONCE · RUN EVERYWHERE";
      ctx.font = `700 15px ${MONO}`;
      const tbW = ctx.measureText(topBadge).width + 36;
      drawPill(ctx, W * 0.5 - tbW * 0.5, cy + 44, topBadge, {
        fg: "#6ee7b7",
        bg: "rgba(58, 210, 159, 0.16)",
        border: "rgba(58, 210, 159, 0.58)",
        font: `700 15px ${MONO}`,
        padX: 18,
        height: 36,
      });

      // Main Hero Heading
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.font = `800 58px ${SANS}`;
      ctx.fillStyle = "#f8fafc";
      ctx.fillText("kinearc v3.0 — Ready to Use", W * 0.5, cy + 162);

      ctx.font = `500 23px ${SANS}`;
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("Universal 4K 60fps Video Production, CV Capture, Interactive Workbench & Audio Engine", W * 0.5, cy + 206);

      // Install Command Box
      const cmdW = 840, cmdH = 74;
      const cmdX = W * 0.5 - cmdW * 0.5;
      const cmdY = cy + 244;
      roundRectPath(ctx, cmdX, cmdY, cmdW, cmdH, 16);
      ctx.fillStyle = "rgba(6, 9, 18, 0.94)";
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "rgba(108, 140, 255, 0.55)";
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = `700 25px ${MONO}`;
      ctx.fillStyle = "#3ad29f";
      ctx.fillText("$", cmdX + 42, cmdY + cmdH * 0.5);
      ctx.fillStyle = "#f1f5f9";
      ctx.fillText("python install.py --agent all", cmdX + 76, cmdY + cmdH * 0.5);

      drawPill(ctx, cmdX + cmdW - 166, cmdY + 19, "ZERO DEPS", {
        fg: "#c7d6ff",
        bg: "rgba(108, 140, 255, 0.18)",
        border: "rgba(108, 140, 255, 0.52)",
        font: `700 13px ${MONO}`,
        padX: 16,
        height: 36,
      });

      // Compatible Agents Row
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.font = `700 14px ${MONO}`;
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("COMPATIBLE CODING AGENTS", W * 0.5, cy + 368);

      const agents = ["Claude Code", "Cursor", "Antigravity", "Kiro", "Windsurf", "Codex"];
      const agW = 182, agH = 48, agGap = 18;
      const totalAgW = agents.length * agW + (agents.length - 1) * agGap;
      const agStartX = W * 0.5 - totalAgW * 0.5;
      const agY = cy + 388;

      for (let i = 0; i < agents.length; i++) {
        const ax = agStartX + i * (agW + agGap);
        const agPop = springProgress(t, { delay: 3.65 + i * 0.08, duration: 0.45, damping: 14, stiffness: 190 });
        ctx.save();
        ctx.globalAlpha *= clamp01(agPop);
        roundRectPath(ctx, ax, agY, agW, agH, 12);
        ctx.fillStyle = "rgba(17, 25, 45, 0.90)";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = i % 2 === 0 ? "rgba(108, 140, 255, 0.55)" : "rgba(58, 210, 159, 0.55)";
        ctx.stroke();

        ctx.font = `700 17px ${SANS}`;
        ctx.fillStyle = "#f1f5f9";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(agents[i], ax + agW * 0.5, agY + agH * 0.5);
        ctx.restore();
      }

      // Bottom summary badges
      ctx.textAlign = "left";
      const specs = [
        "WebGL2 + Canvas2D",
        "3840×2160 @ 60fps",
        "Auto-Ducked BGM + SFX",
      ];
      ctx.font = `700 14px ${MONO}`;
      const spWidths = specs.map((s) => ctx.measureText(s).width + 32);
      const spGap = 20;
      const totalSpW = spWidths.reduce((a, b) => a + b, 0) + spGap * 2;
      let spX = W * 0.5 - totalSpW * 0.5;
      for (let i = 0; i < specs.length; i++) {
        drawPill(ctx, spX, cy + 482, specs[i], {
          fg: i === 1 ? "#6ee7b7" : "#b7c8ff",
          bg: i === 1 ? "rgba(58, 210, 159, 0.14)" : "rgba(108, 140, 255, 0.14)",
          border: i === 1 ? "rgba(58, 210, 159, 0.48)" : "rgba(108, 140, 255, 0.42)",
          font: `700 14px ${MONO}`,
          padX: 16,
          height: 36,
        });
        spX += spWidths[i] + spGap;
      }

      ctx.restore();
    }

    drawStepRail(ctx, W, 932, 4);
    drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · STEP 04 / EXPORT 4K");
  },
});
</script>
</body>
</html>
