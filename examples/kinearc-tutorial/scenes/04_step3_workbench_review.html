<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc Walkthrough — Step 03: Inspect, Annotate & Copy Prompt</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  registerScene,
  createCrystalMesh,
  createTorusMesh,
  drawStageBackdrop,
  drawDepthParticles,
  drawGlassCard,
  drawPill,
  drawCornerHud,
  springProgress,
  easeOutCubic,
  easeInOutCubic,
  smoothstep,
  clamp,
  clamp01,
  lerp,
  roundRectPath,
} from "./kinearc-gl3d.js";

const TOTAL = 7.0;
const stageCrystal = createCrystalMesh(8, 0.95, 2.05, 0.25);
const stageRing = createTorusMesh(1.62, 0.055, 64, 16);

const SANS = 'Inter, "Segoe UI", system-ui, -apple-system, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

const STEPS = [
  "00 WHY KINEARC",
  "01 EXTRACT",
  "02 AUTHOR 3D",
  "03 WORKBENCH",
  "04 EXPORT 4K",
];

function drawStepRail(ctx, W, y, activeIdx) {
  ctx.save();
  const totalW = 1180;
  const gap = 14;
  const pillW = (totalW - gap * (STEPS.length - 1)) / STEPS.length;
  const startX = (W - totalW) * 0.5;
  for (let i = 0; i < STEPS.length; i++) {
    const x = startX + i * (pillW + gap);
    const active = i === activeIdx;
    roundRectPath(ctx, x, y, pillW, 38, 19);
    ctx.fillStyle = active ? "rgba(108, 140, 255, 0.24)" : "rgba(15, 20, 34, 0.72)";
    ctx.fill();
    ctx.lineWidth = active ? 1.8 : 1.1;
    ctx.strokeStyle = active ? "rgba(108, 140, 255, 0.80)" : "rgba(148, 163, 184, 0.22)";
    ctx.stroke();

    ctx.font = `700 13px ${MONO}`;
    ctx.fillStyle = active ? "#e2e8f0" : "rgba(148, 163, 184, 0.68)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(STEPS[i], x + pillW * 0.5, y + 19.5);
  }
  ctx.restore();
}

function drawCursor(ctx, x, y, clicking = 0, rightClick = false) {
  ctx.save();
  if (clicking > 0) {
    const r = 10 + (1 - clicking) * 26;
    ctx.strokeStyle = rightClick ? `rgba(255, 93, 122, ${clicking})` : `rgba(108, 140, 255, ${clicking})`;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.translate(x, y);
  ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 24);
  ctx.lineTo(6.5, 18.5);
  ctx.lineTo(11.5, 29);
  ctx.lineTo(15.2, 27.2);
  ctx.lineTo(10.2, 17);
  ctx.lineTo(18.5, 16.5);
  ctx.closePath();
  ctx.fillStyle = rightClick ? "#ffe4ea" : "#ffffff";
  ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = rightClick ? "#ff5d7a" : "#0b0d13";
  ctx.stroke();
  ctx.restore();
}

function easeSegment(t, t0, t1, p0, p1) {
  const u = easeInOutCubic(clamp01((t - t0) / Math.max(1e-5, t1 - t0)));
  return [lerp(p0[0], p1[0], u), lerp(p0[1], p1[1], u)];
}

function drawUiButton(ctx, x, y, w, h, label, {
  bg = "#191d2b",
  border = "#262b3d",
  fg = "#eceff7",
  glow = null,
  font = `600 12px ${SANS}`,
} = {}) {
  ctx.save();
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 18;
  }
  roundRectPath(ctx, x, y, w, h, 7);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = border;
  ctx.stroke();
  ctx.font = font;
  ctx.fillStyle = fg;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w * 0.5, y + h * 0.5 + 0.5);
  ctx.restore();
}

registerScene({
  width: 1920,
  height: 1080,
  fps: 60,
  totalDuration: TOTAL,
  onFrame({ ctx, gl, W, H, t, total }) {
    drawStageBackdrop(ctx, W, H, t, {
      accentA: "#6c8cff",
      accentB: "#3ad29f",
      gridAlpha: 0.06,
    });
    drawDepthParticles(ctx, W, H, t, 36);

    const enterP = easeOutCubic(clamp01(t / 0.38));
    const exitP = smoothstep(total - 0.30, total, t);

    // Subtle 3D scene rendered for Stage viewport preview
    if (gl) {
      gl.render({
        cameraPos: [Math.sin(t * 0.6) * 0.4, 0.25, 4.9],
        cameraTarget: [0, 0, 0],
        fovDeg: 40,
        keyColor: [0.65, 0.80, 1.0],
        fillColor: [0.23, 0.88, 0.66],
        objects: [
          {
            mesh: stageCrystal,
            pos: [0, 0, 0],
            rot: [0.22, t * 0.9, 0.12],
            scale: 1.0,
            color: [0.42, 0.58, 1.0],
            emissive: [0.06, 0.12, 0.28],
            roughness: 0.18,
            metallic: 0.85,
            alpha: 1.0,
          },
          {
            mesh: stageRing,
            pos: [0, 0, 0],
            rot: [1.15, -t * 0.75, 0.3],
            scale: 1.0,
            color: [0.23, 0.86, 0.65],
            emissive: [0.03, 0.16, 0.12],
            roughness: 0.22,
            metallic: 0.85,
            alpha: 0.95,
          },
        ],
      });
    }

    ctx.save();
    if (exitP > 0) {
      ctx.globalAlpha = 1 - exitP * 0.92;
      const sc = 1 - exitP * 0.03;
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(sc, sc);
      ctx.translate(-W * 0.5, -H * 0.5);
    }

    // Active mode & step state across 0..7.0s
    let activeMode = "live";
    if (t >= 0.60 && t < 1.15) activeMode = "clone";
    else if (t >= 1.15 && t < 1.72) activeMode = "split";
    else if (t >= 1.72 && t < 2.95) activeMode = "diff";
    else if (t >= 2.95) activeMode = "live";

    const hasIn = t >= 2.40;
    const hasOut = t >= 2.90;
    const boxDragging = t >= 3.35 && t < 4.10;
    const boxDone = t >= 4.10;
    const boxDragFrac = clamp01((t - 3.35) / 0.75);
    const hasDraftPin = t >= 4.30 && t < 5.20;
    const showEraseTip = t >= 4.68 && t < 5.20;
    const draftFade = t >= 4.95 ? 1 - clamp01((t - 4.95) / 0.25) : 1;
    const copyClicked = t >= 5.90;
    const copyGlow = clamp01((t - 5.45) / 0.45);

    let actionBadge = "1/5 CYCLE MODE TABS (LIVE → DIFF)";
    if (t >= 2.15 && t < 3.20) actionBadge = "2/5 CLIP RANGE [ In f10 · Out f35 ]";
    else if (t >= 3.20 && t < 4.30) actionBadge = "3/5 DRAG STAGE BOX ANNOTATION";
    else if (t >= 4.30 && t < 5.40) actionBadge = "4/5 RIGHT-CLICK ERASE DRAFT PIN";
    else if (t >= 5.40) actionBadge = "5/5 COPY AI REVISION PROMPT";

    // Header
    ctx.save();
    ctx.globalAlpha *= enterP;
    drawPill(ctx, 96, 82, "STEP 03 · INSPECT, ANNOTATE & COPY PROMPT", {
      fg: "#c7d6ff",
      bg: "rgba(108, 140, 255, 0.16)",
      border: "rgba(108, 140, 255, 0.55)",
      font: `700 16px ${MONO}`,
      padX: 18,
      height: 36,
    });

    ctx.font = `700 15px ${MONO}`;
    const abW = ctx.measureText(actionBadge).width + 36;
    drawPill(ctx, 1824 - abW, 82, actionBadge, {
      fg: "#6ee7b7",
      bg: "rgba(58, 210, 159, 0.14)",
      border: "rgba(58, 210, 159, 0.52)",
      font: `700 15px ${MONO}`,
      padX: 18,
      height: 36,
    });

    ctx.font = `800 42px ${SANS}`;
    ctx.fillStyle = "#f1f5f9";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("Dual-Mode Workbench: Diff, Range, Pin & Prompt", 96, 168);
    ctx.font = `500 19px ${SANS}`;
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("Compare Live HTML against MP4 renders, pin box/range notes, and send straight to your agent", 96, 198);
    ctx.restore();

    // --- WORKBENCH SHELL ---
    const wbX = 96, wbY = 218, wbW = 1728, wbH = 688;
    const wbP = springProgress(t, { delay: 0.06, duration: 0.58, damping: 16, stiffness: 170 });

    ctx.save();
    ctx.globalAlpha *= clamp01(wbP);
    drawGlassCard(ctx, wbX, wbY, wbW, wbH, {
      radius: 16,
      fill: "#0b0d13",
      border: "rgba(108, 140, 255, 0.40)",
      glow: "rgba(108, 140, 255, 0.16)",
    });

    // 1) TopBar (h=52)
    const topH = 52;
    roundRectPath(ctx, wbX + 1, wbY + 1, wbW - 2, topH, 15);
    ctx.fillStyle = "#12151f";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wbX, wbY + topH);
    ctx.lineTo(wbX + wbW, wbY + topH);
    ctx.stroke();

    // Left brand + meta badge
    drawUiButton(ctx, wbX + 16, wbY + 11, 82, 30, "kinearc", {
      bg: "#191d2b",
      border: "#2f3752",
      fg: "#eceff7",
      font: `800 13px ${SANS}`,
    });

    const curFrameNum = t < 2.2 ? 10 : (t < 2.9 ? Math.round(lerp(10, 35, clamp01((t - 2.4) / 0.5))) : 35);
    drawPill(ctx, wbX + 108, wbY + 13, `1920×1080 · 60fps · f${curFrameNum}`, {
      fg: "#b7c8ff",
      bg: "rgba(108, 140, 255, 0.15)",
      border: "rgba(108, 140, 255, 0.36)",
      font: `700 11.5px ${MONO}`,
      padX: 10,
      height: 26,
    });

    // Mode tabs container
    const modes = [
      { id: "live", label: "Live", w: 54 },
      { id: "clone", label: "Clone", w: 64 },
      { id: "sbs", label: "Side-by-Side", w: 102 },
      { id: "split", label: "Split", w: 56 },
      { id: "onion", label: "Onion", w: 64 },
      { id: "diff", label: "Diff", w: 52 },
    ];
    const tabsX = wbX + 370;
    const tabsW = 418;
    roundRectPath(ctx, tabsX, wbY + 9, tabsW, 34, 9);
    ctx.fillStyle = "#0b0d13";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.stroke();

    const modePositions = {};
    let mx = tabsX + 4;
    for (const m of modes) {
      const isAct = m.id === activeMode;
      roundRectPath(ctx, mx, wbY + 13, m.w, 26, 6);
      ctx.fillStyle = isAct ? "#6c8cff" : "transparent";
      ctx.fill();
      ctx.font = `600 12px ${SANS}`;
      ctx.fillStyle = isAct ? "#ffffff" : "#8b93ad";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(m.label, mx + m.w * 0.5, wbY + 26.5);
      modePositions[m.id] = [mx + m.w * 0.5, wbY + 26];
      mx += m.w + 4;
    }
    ctx.textAlign = "left";

    // Split 50% badge when Split is active
    if (activeMode === "split") {
      drawPill(ctx, tabsX + tabsW + 14, wbY + 12, "Split  50%", {
        fg: "#eceff7",
        bg: "#191d2b",
        border: "#6c8cff",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 28,
      });
    }

    // Right toolbar buttons
    drawUiButton(ctx, wbX + wbW - 504, wbY + 12, 98, 28, "Safe: 16:9", {
      bg: "#191d2b",
      border: "#3b4566",
      fg: "#cbd5e1",
    });
    drawUiButton(ctx, wbX + wbW - 396, wbY + 12, 86, 28, "2× Loupe", {});
    drawUiButton(ctx, wbX + wbW - 300, wbY + 12, 74, 28, "Drawer", {
      bg: "rgba(108, 140, 255, 0.16)",
      border: "#6c8cff",
      fg: "#d6e0ff",
    });
    drawUiButton(ctx, wbX + wbW - 216, wbY + 12, 110, 28, "Copy Prompt", {});
    drawUiButton(ctx, wbX + wbW - 96, wbY + 12, 78, 28, "Export", {
      bg: "#6c8cff",
      border: "#6c8cff",
      fg: "#ffffff",
    });

    // 2) Workspace Body (Stage left + Drawer right)
    const drawerW = 516;
    const stagePaneX = wbX;
    const stagePaneY = wbY + topH;
    const stagePaneW = wbW - drawerW; // 1212
    const stagePaneH = wbH - topH - 134; // 502

    const drawerX = wbX + stagePaneW;
    const drawerY = stagePaneY;
    const drawerH = stagePaneH;

    // Stage background
    ctx.fillStyle = "#080a10";
    ctx.fillRect(stagePaneX + 1, stagePaneY, stagePaneW - 1, stagePaneH);

    // Aspect-locked 16:9 inner stage viewport
    const vpW = 824, vpH = 463.5;
    const vpX = stagePaneX + (stagePaneW - vpW) * 0.5;
    const vpY = stagePaneY + (stagePaneH - vpH) * 0.5;

    roundRectPath(ctx, vpX, vpY, vpW, vpH, 10);
    ctx.fillStyle = "#0b0e17";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.save();
    roundRectPath(ctx, vpX + 1, vpY + 1, vpW - 2, vpH - 2, 9);
    ctx.clip();

    // Inner simulated stage art
    const bgGrad = ctx.createRadialGradient(vpX + vpW * 0.5, vpY + vpH * 0.5, 20, vpX + vpW * 0.5, vpY + vpH * 0.5, 420);
    bgGrad.addColorStop(0, "#17203a");
    bgGrad.addColorStop(1, "#090c16");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(vpX, vpY, vpW, vpH);

    if (gl) {
      const dh = vpH * 0.94;
      const dw = dh * (W / H);
      ctx.drawImage(gl.canvas, vpX + vpW * 0.5 - dw * 0.5, vpY + vpH * 0.5 - dh * 0.5, dw, dh);
    }

    // Mode-specific visual overlays inside Stage!
    if (activeMode === "clone") {
      drawPill(ctx, vpX + 18, vpY + 18, "CLONE MP4 PLAYBACK", {
        fg: "#6ee7b7",
        bg: "rgba(11, 15, 28, 0.85)",
        border: "#3ad29f",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
    } else if (activeMode === "split") {
      const splitX = vpX + vpW * 0.5;
      // Slight cool tint on right half to signify Ref vs Clone comparison
      ctx.fillStyle = "rgba(58, 210, 159, 0.08)";
      ctx.fillRect(splitX, vpY, vpW * 0.5, vpH);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(splitX, vpY);
      ctx.lineTo(splitX, vpY + vpH);
      ctx.stroke();

      drawPill(ctx, splitX - 96, vpY + 18, "REF", {
        fg: "#e2e8f0",
        bg: "rgba(11, 13, 19, 0.88)",
        border: "#6c8cff",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
      drawPill(ctx, splitX + 16, vpY + 18, "CLONE · 50%", {
        fg: "#6ee7b7",
        bg: "rgba(11, 13, 19, 0.88)",
        border: "#3ad29f",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
    } else if (activeMode === "diff") {
      ctx.fillStyle = "rgba(10, 6, 20, 0.72)";
      ctx.fillRect(vpX, vpY, vpW, vpH);
      // 4x Error Heatmap contour rings
      ctx.strokeStyle = "#3ad29f";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(vpX + vpW * 0.5, vpY + vpH * 0.5, 92, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#ff5d7a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(vpX + vpW * 0.5 + 16, vpY + vpH * 0.5 - 12, 46, 0, Math.PI * 2);
      ctx.stroke();

      drawPill(ctx, vpX + 18, vpY + 18, "4× PIXEL DIFF HEATMAP · MAE 1.12", {
        fg: "#fda4af",
        bg: "rgba(20, 10, 24, 0.90)",
        border: "#ff5d7a",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
    } else {
      // Live safe zone 16:9 guide
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = "rgba(108, 140, 255, 0.34)";
      ctx.lineWidth = 1.4;
      ctx.strokeRect(vpX + 38, vpY + 26, vpW - 76, vpH - 52);
      ctx.restore();
      drawPill(ctx, vpX + 18, vpY + 18, "LIVE SCENE · window.kinearc.seek()", {
        fg: "#c7d6ff",
        bg: "rgba(11, 15, 28, 0.84)",
        border: "rgba(108, 140, 255, 0.52)",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
    }

    // Stage Annotation Box #1
    const bx0 = vpX + 275, by0 = vpY + 118;
    const bx1Target = vpX + 555, by1Target = vpY + 344;
    if (boxDragging || boxDone) {
      const curBx1 = boxDone ? bx1Target : lerp(bx0 + 24, bx1Target, easeOutCubic(boxDragFrac));
      const curBy1 = boxDone ? by1Target : lerp(by0 + 24, by1Target, easeOutCubic(boxDragFrac));
      ctx.save();
      ctx.fillStyle = "rgba(108, 140, 255, 0.16)";
      ctx.fillRect(bx0, by0, curBx1 - bx0, curBy1 - by0);
      ctx.strokeStyle = "#6c8cff";
      ctx.lineWidth = 2.6;
      if (boxDragging) ctx.setLineDash([7, 5]);
      ctx.strokeRect(bx0, by0, curBx1 - bx0, curBy1 - by0);
      ctx.setLineDash([]);

      drawPill(ctx, bx0, by0 - 30, boxDone ? "#1 · Box [410, 180, 760, 410]" : "Dragging Box...", {
        fg: "#ffffff",
        bg: "#111629",
        border: "#6c8cff",
        font: `700 12px ${MONO}`,
        padX: 10,
        height: 24,
      });
      ctx.restore();
    }

    // Draft Pin #2 + Right-Click Erase Tooltip
    const dpx = vpX + 668, dpy = vpY + 196;
    if (hasDraftPin && draftFade > 0) {
      ctx.save();
      ctx.globalAlpha *= draftFade;
      ctx.strokeStyle = "#ffb454";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(dpx, dpy, 17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#ffb454";
      ctx.beginPath();
      ctx.arc(dpx, dpy, 5, 0, Math.PI * 2);
      ctx.fill();

      drawPill(ctx, dpx - 44, dpy - 46, "#2 (draft)", {
        fg: "#fde68a",
        bg: "#16141d",
        border: "#ffb454",
        font: `700 11.5px ${MONO}`,
        padX: 10,
        height: 22,
      });

      if (showEraseTip) {
        drawPill(ctx, dpx - 188, dpy + 22, "Right-click · Erase draft pin", {
          fg: "#ffe4ea",
          bg: "rgba(28, 14, 22, 0.96)",
          border: "#ff5d7a",
          font: `700 12.5px ${MONO}`,
          padX: 14,
          height: 30,
        });
      }
      ctx.restore();
    }

    // Toast notification on Copy AI Prompt
    if (copyClicked) {
      const tp = springProgress(t, { delay: 5.90, duration: 0.42, damping: 14, stiffness: 200 });
      ctx.save();
      ctx.globalAlpha *= clamp01(tp);
      ctx.translate(0, (1 - tp) * 14);
      const toastTxt = "✓ Copied AI Prompt (1 note · .kinearc_analysis/selection.json)";
      ctx.font = `700 13px ${MONO}`;
      const tw = ctx.measureText(toastTxt).width + 32;
      drawPill(ctx, vpX + vpW - tw - 16, vpY + vpH - 46, toastTxt, {
        fg: "#ecfdf5",
        bg: "rgba(16, 42, 36, 0.96)",
        border: "#3ad29f",
        font: `700 13px ${MONO}`,
        padX: 16,
        height: 34,
      });
      ctx.restore();
    }
    ctx.restore();

    // 3) Right Inspector Drawer
    ctx.fillStyle = "#12151f";
    ctx.fillRect(drawerX, drawerY, drawerW, drawerH);
    ctx.strokeStyle = "#262b3d";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(drawerX, drawerY);
    ctx.lineTo(drawerX, drawerY + drawerH);
    ctx.stroke();

    // Drawer Tabs
    const dTabs = ["Notes", "QA", "Audio & Out"];
    const dTabW = drawerW / 3;
    for (let i = 0; i < 3; i++) {
      const tx = drawerX + i * dTabW;
      const act = i === 0;
      ctx.fillStyle = act ? "#191d2b" : "#12151f";
      ctx.fillRect(tx, drawerY, dTabW, 42);
      if (act) {
        ctx.fillStyle = "#6c8cff";
        ctx.fillRect(tx, drawerY + 39, dTabW, 3);
      }
      ctx.font = `700 13px ${SANS}`;
      ctx.fillStyle = act ? "#eceff7" : "#8b93ad";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(dTabs[i], tx + dTabW * 0.5, drawerY + 21);
    }
    ctx.textAlign = "left";

    // Drawer Composer Card
    const compX = drawerX + 18, compY = drawerY + 58, compW = drawerW - 36;
    roundRectPath(ctx, compX, compY, compW, 178, 12);
    ctx.fillStyle = "#191d2b";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.stroke();

    const selTargetText = boxDone
      ? "Range f10–f35 · Box [410, 180, 760, 410]"
      : (hasOut ? "Range f10–f35 (0.17s–0.58s) · Clip range" : (hasIn ? "Frame f10 (0.17s) · In set" : "Frame f10 (0.17s) · Full frame"));
    ctx.font = `700 12px ${MONO}`;
    ctx.fillStyle = "#b7c8ff";
    ctx.textBaseline = "middle";
    ctx.fillText(selTargetText, compX + 14, compY + 22);

    // Note textarea box
    roundRectPath(ctx, compX + 12, compY + 40, compW - 24, 72, 8);
    ctx.fillStyle = "#0b0d13";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.stroke();
    ctx.font = `500 13.5px ${SANS}`;
    ctx.fillStyle = boxDone ? "#eceff7" : "#64748b";
    ctx.fillText(
      boxDone ? "Tighten orb easing & boost rim glow" : "Click a point or drag a box on the stage...",
      compX + 24,
      compY + 76
    );

    // Save Note & Glowing Copy AI Prompt Buttons
    const btnSaveX = compX + 12, btnSaveY = compY + 126, btnSaveW = 212, btnH = 36;
    const btnCopyX = compX + 234, btnCopyY = compY + 126, btnCopyW = compW - 246;
    drawUiButton(ctx, btnSaveX, btnSaveY, btnSaveW, btnH, "Save Note", {
      bg: "#232a3e",
      border: "#374162",
      fg: "#eceff7",
      font: `700 13px ${SANS}`,
    });

    const copyBtnGlow = copyGlow > 0.1
      ? (copyClicked ? "rgba(58, 210, 159, 0.72)" : "rgba(108, 140, 255, 0.75)")
      : null;
    drawUiButton(ctx, btnCopyX, btnCopyY, btnCopyW, btnH, copyClicked ? "Copied ✓" : "Copy AI Prompt", {
      bg: copyClicked ? "#22a87b" : (copyGlow > 0.1 ? "#6c8cff" : "#1d2438"),
      border: copyClicked ? "#3ad29f" : (copyGlow > 0.1 ? "#a5b8ff" : "#384366"),
      fg: "#ffffff",
      glow: copyBtnGlow,
      font: `700 13px ${SANS}`,
    });

    // Notes list items
    const listY = compY + 194;
    if (boxDone) {
      roundRectPath(ctx, compX, listY, compW, 92, 10);
      ctx.fillStyle = "#191d2b";
      ctx.fill();
      ctx.strokeStyle = "rgba(108, 140, 255, 0.55)";
      ctx.stroke();
      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = "#6c8cff";
      ctx.fillText("#1 · Range f10–f35 · Box [410, 180, 760, 410]", compX + 14, listY + 24);
      ctx.font = `600 13.5px ${SANS}`;
      ctx.fillStyle = "#eceff7";
      ctx.fillText("Tighten orb easing & boost rim glow", compX + 14, listY + 52);
      ctx.font = `600 11.5px ${MONO}`;
      ctx.fillStyle = "#6ee7b7";
      ctx.fillText("snapshot: selection/note_1.png · OPEN", compX + 14, listY + 76);
    }
    if (hasDraftPin && draftFade > 0) {
      const dy2 = listY + (boxDone ? 102 : 0);
      ctx.save();
      ctx.globalAlpha *= draftFade;
      roundRectPath(ctx, compX, dy2, compW, 64, 10);
      ctx.fillStyle = "#1f1822";
      ctx.fill();
      ctx.strokeStyle = showEraseTip ? "#ff5d7a" : "#ffb454";
      ctx.stroke();
      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = showEraseTip ? "#ff8da1" : "#fde68a";
      ctx.fillText("#2 (draft) · Point (920, 290)", compX + 14, dy2 + 24);
      ctx.font = `500 12px ${SANS}`;
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText(showEraseTip ? "Erasing draft pin..." : "Draft stage pin", compX + 14, dy2 + 46);
      ctx.restore();
    }

    // 4) Bottom Timeline Dock (h=134)
    const dockY = wbY + wbH - 134;
    ctx.fillStyle = "#12151f";
    ctx.fillRect(wbX + 1, dockY, wbW - 2, 133);
    ctx.strokeStyle = "#262b3d";
    ctx.beginPath();
    ctx.moveTo(wbX, dockY);
    ctx.lineTo(wbX + wbW, dockY);
    ctx.stroke();

    // Transport buttons
    const trBtns = [
      { label: "« 10f", w: 58 },
      { label: "‹ 1f", w: 48 },
      { label: "Play", w: 62, accent: true },
      { label: "1f ›", w: 48 },
      { label: "10f »", w: 58 },
      { label: hasIn ? "[ In f10" : "[ In", w: hasIn ? 78 : 56, id: "in", active: hasIn },
      { label: hasOut ? "Out f35 ]" : "Out ]", w: hasOut ? 86 : 60, id: "out", active: hasOut },
    ];
    let tbx = wbX + 18;
    const tby = dockY + 12;
    let inBtnCenter = [0, 0];
    let outBtnCenter = [0, 0];
    for (const b of trBtns) {
      drawUiButton(ctx, tbx, tby, b.w, 30, b.label, {
        bg: b.accent ? "#6c8cff" : (b.active ? "rgba(108, 140, 255, 0.24)" : "#191d2b"),
        border: b.accent || b.active ? "#6c8cff" : "#262b3d",
        fg: b.accent ? "#ffffff" : (b.active ? "#d6e0ff" : "#eceff7"),
        font: `700 12px ${b.id ? MONO : SANS}`,
      });
      if (b.id === "in") inBtnCenter = [tbx + b.w * 0.5, tby + 15];
      if (b.id === "out") outBtnCenter = [tbx + b.w * 0.5, tby + 15];
      tbx += b.w + 8;
    }

    // Right status on transport bar
    if (hasOut) {
      drawPill(ctx, wbX + wbW - 356, tby + 2, "Range f10–f35", {
        fg: "#b7c8ff",
        bg: "rgba(108, 140, 255, 0.16)",
        border: "#6c8cff",
        font: `700 12px ${MONO}`,
        padX: 12,
        height: 26,
      });
    }
    ctx.font = `700 13px ${MONO}`;
    ctx.fillStyle = "#eceff7";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(`00:00.${String(Math.round((curFrameNum / 60) * 100)).padStart(2, "0")} / 00:01.50 · f${curFrameNum}`, wbX + wbW - 18, tby + 15);
    ctx.textAlign = "left";

    // Timeline Track + Waveform + Highlighted Clip Range Bar
    const tkX = wbX + 18, tkY = dockY + 52, tkW = wbW - 36, tkH = 68;
    roundRectPath(ctx, tkX, tkY, tkW, tkH, 10);
    ctx.fillStyle = "#0b0d13";
    ctx.fill();
    ctx.strokeStyle = "#262b3d";
    ctx.stroke();

    // Simulated audio waveform bars
    ctx.save();
    for (let i = 0; i < 120; i++) {
      const wx = tkX + 8 + (i / 120) * (tkW - 16);
      const amp = 6 + Math.abs(Math.sin(i * 0.43) * Math.cos(i * 0.19)) * 22;
      ctx.fillStyle = "rgba(108, 140, 255, 0.34)";
      ctx.fillRect(wx, tkY + tkH * 0.5 - amp, 6, amp * 2);
    }

    // Clip range highlight bar (f10..f35 out of 90 frames)
    const inFrac = 10 / 90;
    const outFrac = 35 / 90;
    const curFrac = curFrameNum / 90;
    if (hasIn) {
      const rX0 = tkX + inFrac * tkW;
      const rX1 = tkX + (hasOut ? outFrac : curFrac) * tkW;
      const rW = Math.max(8, rX1 - rX0);
      ctx.fillStyle = "rgba(108, 140, 255, 0.24)";
      ctx.fillRect(rX0, tkY + 2, rW, tkH - 4);
      ctx.strokeStyle = "#6c8cff";
      ctx.lineWidth = 2.4;
      ctx.strokeRect(rX0, tkY + 2, rW, tkH - 4);
      ctx.fillStyle = "#d6e0ff";
      ctx.font = `700 11px ${MONO}`;
      ctx.fillText(hasOut ? "CLIP RANGE: f10–f35" : "IN f10", rX0 + 8, tkY + 14);
    }

    // Timeline Markers (Cut, SFX, Worst MAE)
    const markers = [
      { frac: 0.28, col: "#3ad29f", lbl: "SFX" },
      { frac: 0.52, col: "#ffb454", lbl: "CUT f47" },
      { frac: 0.74, col: "#ff5d7a", lbl: "MAE" },
    ];
    for (const mk of markers) {
      const mxPos = tkX + mk.frac * tkW;
      ctx.fillStyle = mk.col;
      ctx.fillRect(mxPos - 1, tkY + 4, 2, tkH - 8);
      ctx.font = `700 10px ${MONO}`;
      ctx.fillText(mk.lbl, mxPos + 5, tkY + tkH - 12);
    }

    // Playhead line
    const phX = tkX + curFrac * tkW;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(phX, tkY);
    ctx.lineTo(phX, tkY + tkH);
    ctx.stroke();
    ctx.fillStyle = "#6c8cff";
    ctx.beginPath();
    ctx.arc(phX, tkY + 6, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Animated Cursor Choreography across 0..7.0s
    let curPos = [modePositions.live[0], modePositions.live[1]];
    let clickAnim = 0;
    let isRightClick = false;
    const copyCenter = [btnCopyX + btnCopyW * 0.5, btnCopyY + btnH * 0.5];

    if (t < 0.60) {
      curPos = easeSegment(t, 0.25, 0.58, modePositions.live, modePositions.clone);
    } else if (t < 1.15) {
      clickAnim = clamp01(1 - (t - 0.60) / 0.25);
      curPos = easeSegment(t, 0.80, 1.13, modePositions.clone, modePositions.split);
    } else if (t < 1.72) {
      clickAnim = clamp01(1 - (t - 1.15) / 0.25);
      curPos = easeSegment(t, 1.38, 1.70, modePositions.split, modePositions.diff);
    } else if (t < 2.40) {
      clickAnim = clamp01(1 - (t - 1.72) / 0.25);
      curPos = easeSegment(t, 1.95, 2.38, modePositions.diff, inBtnCenter);
    } else if (t < 2.90) {
      clickAnim = clamp01(1 - (t - 2.40) / 0.25);
      curPos = easeSegment(t, 2.52, 2.88, inBtnCenter, outBtnCenter);
    } else if (t < 3.35) {
      clickAnim = clamp01(1 - (t - 2.90) / 0.25);
      curPos = easeSegment(t, 3.00, 3.33, outBtnCenter, [bx0, by0]);
    } else if (t < 4.10) {
      curPos = [lerp(bx0, bx1Target, easeOutCubic(boxDragFrac)), lerp(by0, by1Target, easeOutCubic(boxDragFrac))];
    } else if (t < 4.80) {
      curPos = easeSegment(t, 4.25, 4.72, [bx1Target, by1Target], [dpx, dpy]);
    } else if (t < 5.30) {
      isRightClick = true;
      clickAnim = clamp01(1 - (t - 4.80) / 0.30);
      curPos = [dpx, dpy];
    } else {
      curPos = easeSegment(t, 5.32, 5.85, [dpx, dpy], copyCenter);
      if (t >= 5.90) clickAnim = clamp01(1 - (t - 5.90) / 0.35);
    }

    drawCursor(ctx, curPos[0], curPos[1], clickAnim, isRightClick);
    ctx.restore();

    drawStepRail(ctx, W, 932, 3);
    ctx.restore();
    drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · STEP 03 / WORKBENCH");
  },
});
</script>
</body>
</html>
