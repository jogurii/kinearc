<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>kinearc Walkthrough — 00 / Why kinearc</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070c;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  registerScene,
  createCrystalMesh,
  createTorusMesh,
  drawStageBackdrop,
  drawDepthParticles,
  drawGlassCard,
  drawPill,
  drawCornerHud,
  springProgress,
  easeOutCubic,
  easeInOutCubic,
  smoothstep,
  clamp01,
  lerp,
  roundRectPath,
} from "./kinearc-gl3d.js";

const TOTAL = 5.0;
const crystal = createCrystalMesh(8, 1.12, 2.65, 0.25);
const ringInner = createTorusMesh(1.92, 0.048, 72, 16);
const ringOuter = createTorusMesh(2.42, 0.034, 72, 16);

const SANS = 'Inter, "Segoe UI", system-ui, -apple-system, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

const STEPS = [
  "00 WHY KINEARC",
  "01 EXTRACT",
  "02 AUTHOR 3D",
  "03 WORKBENCH",
  "04 EXPORT 4K",
];

function drawStepRail(ctx, W, y, activeIdx, t) {
  ctx.save();
  const totalW = 1180;
  const gap = 14;
  const pillW = (totalW - gap * (STEPS.length - 1)) / STEPS.length;
  const startX = (W - totalW) * 0.5;
  for (let i = 0; i < STEPS.length; i++) {
    const x = startX + i * (pillW + gap);
    const active = i === activeIdx;
    roundRectPath(ctx, x, y, pillW, 38, 19);
    ctx.fillStyle = active ? "rgba(108, 140, 255, 0.22)" : "rgba(15, 20, 34, 0.72)";
    ctx.fill();
    ctx.lineWidth = active ? 1.8 : 1.1;
    ctx.strokeStyle = active ? "rgba(108, 140, 255, 0.78)" : "rgba(148, 163, 184, 0.22)";
    ctx.stroke();

    ctx.font = `700 13px ${MONO}`;
    ctx.fillStyle = active ? "#e2e8f0" : "rgba(148, 163, 184, 0.68)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(STEPS[i], x + pillW * 0.5, y + 19.5);
  }
  ctx.restore();
}

function targetCurveVal(u) {
  // Smooth ease-in -> stationary hold plateau -> ease-out
  if (u < 0.36) return easeInOutCubic(u / 0.36);
  if (u < 0.68) return 1.0;
  return 1.0 - easeInOutCubic((u - 0.68) / 0.32);
}

function naiveDriftedVal(u) {
  // Sparse fps=3 stepped approximation + lag + hold jitter
  const stepU = Math.floor(u * 6.0) / 6.0;
  const base = targetCurveVal(Math.max(0, stepU - 0.08)) * 0.78;
  const drift = Math.sin(u * 13.0) * 0.14 + Math.cos(u * 29.0) * 0.055;
  return Math.max(0.03, Math.min(0.96, base + 0.12 + drift));
}

registerScene({
  width: 1920,
  height: 1080,
  fps: 60,
  totalDuration: TOTAL,
  onFrame({ ctx, gl, W, H, t, total }) {
    drawStageBackdrop(ctx, W, H, t, {
      accentA: "#6c8cff",
      accentB: "#3ad29f",
      gridAlpha: 0.075,
    });
    drawDepthParticles(ctx, W, H, t, 54);

    // Exit fade/scale polish for transition to Scene 2
    const exitP = smoothstep(total - 0.32, total, t);
    const enter3d = springProgress(t, { delay: 0.04, duration: 0.7, damping: 14, stiffness: 160 });
    const lockPulse = springProgress(t, { delay: 0.25, duration: 0.5, damping: 15, stiffness: 210 });

    if (gl) {
      const s = (0.85 + 0.15 * enter3d) * (1 - 0.08 * exitP);
      gl.render({
        cameraPos: [Math.sin(t * 0.35) * 0.45, 0.35 + Math.cos(t * 0.4) * 0.12, 6.2],
        cameraTarget: [0, 0, 0],
        fovDeg: 40,
        keyColor: [0.62, 0.78, 1.0],
        fillColor: [0.23, 0.85, 0.64],
        objects: [
          {
            mesh: crystal,
            pos: [0, -0.14, 0],
            rot: [0.16 + Math.sin(t * 0.8) * 0.08, t * 0.65, 0.14],
            scale: [1.02 * s, 1.02 * s, 1.02 * s],
            color: [0.34, 0.54, 0.98],
            emissive: [0.04, 0.07 + 0.05 * lockPulse, 0.18],
            roughness: 0.22,
            metallic: 0.84,
            alpha: 0.86 * (1 - exitP * 0.6),
          },
          {
            mesh: ringInner,
            pos: [0, -0.14, 0],
            rot: [1.05, t * 0.52, 0.45],
            scale: 0.92 * s,
            color: [0.23, 0.85, 0.64],
            emissive: [0.02, 0.11, 0.08],
            roughness: 0.24,
            metallic: 0.85,
            alpha: 0.78 * (1 - exitP * 0.6),
          },
          {
            mesh: ringOuter,
            pos: [0, -0.14, 0],
            rot: [-0.72, -t * 0.38, 0.85],
            scale: 0.90 * s,
            color: [0.60, 0.52, 1.0],
            emissive: [0.06, 0.05, 0.16],
            roughness: 0.28,
            metallic: 0.80,
            alpha: 0.64 * (1 - exitP * 0.6),
          },
        ],
      });
      ctx.drawImage(gl.canvas, 0, 0, W, H);
    }

    ctx.save();
    if (exitP > 0) {
      ctx.globalAlpha = 1 - exitP * 0.92;
      const sc = 1 - exitP * 0.03;
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(sc, sc);
      ctx.translate(-W * 0.5, -H * 0.5);
    }

    // Header region
    const headP = easeOutCubic(clamp01(t / 0.45));
    ctx.save();
    ctx.globalAlpha *= headP;
    ctx.translate(0, (1 - headP) * 18);
    drawPill(ctx, 96, 86, "00 / WHY KINEARC", {
      fg: "#c7d6ff",
      bg: "rgba(108, 140, 255, 0.16)",
      border: "rgba(108, 140, 255, 0.58)",
      font: `700 16px ${MONO}`,
      padX: 18,
      height: 36,
    });
    ctx.font = `800 46px ${SANS}`;
    ctx.fillStyle = "#f1f5f9";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("Deterministic Motion Engineering — Not Guesswork", 96, 174);
    ctx.font = `500 21px ${SANS}`;
    ctx.fillStyle = "#94a3b8";
    ctx.fillText("Replace sparse frame approximation with time-locked 60fps pipelines and 4K export", 96, 208);
    ctx.restore();

    // Left Card: Naive Prompting
    const leftP = springProgress(t, { delay: 0.18, duration: 0.65, damping: 16, stiffness: 165 });
    const rightP = springProgress(t, { delay: 0.30, duration: 0.65, damping: 16, stiffness: 165 });

    const lx = 96, ly = 240, lw = 824, lh = 640;
    const rx = 1000, ry = 240, rw = 824, rh = 640;

    // --- LEFT CARD ---
    ctx.save();
    ctx.globalAlpha *= clamp01(leftP);
    ctx.translate(0, (1 - leftP) * 32);
    drawGlassCard(ctx, lx, ly, lw, lh, {
      radius: 20,
      fill: "rgba(19, 13, 24, 0.80)",
      border: "rgba(255, 93, 122, 0.46)",
      glow: "rgba(255, 93, 122, 0.14)",
    });

    // Header
    ctx.fillStyle = "#ff5d7a";
    ctx.beginPath();
    ctx.arc(lx + 42, ly + 48, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = `800 28px ${SANS}`;
    ctx.fillStyle = "#ffe4ea";
    ctx.textBaseline = "middle";
    ctx.fillText("Naive Prompting", lx + 62, ly + 49);

    const warnLabel = "MAE 42.6 WARN";
    ctx.font = `700 16px ${MONO}`;
    const warnW = ctx.measureText(warnLabel).width + 34;
    drawPill(ctx, lx + lw - 36 - warnW, ly + 30, warnLabel, {
      fg: "#ff8da1",
      bg: "rgba(255, 93, 122, 0.18)",
      border: "rgba(255, 93, 122, 0.68)",
      font: `700 16px ${MONO}`,
      padX: 17,
      height: 38,
    });

    // Section 1: Sparse fps=3 frame gaps
    ctx.font = `700 14px ${MONO}`;
    ctx.fillStyle = "#fda4af";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("SPARSE SAMPLING · fps=3 · 333ms FRAME GAPS", lx + 36, ly + 114);

    const slotY = ly + 132;
    const slotH = 82;
    const slotW = 104;
    const slotSpan = lw - 72;
    const slotGap = (slotSpan - slotW * 4) / 3;
    const activeSlot = Math.floor((t * 1.4) % 4);
    const frameTags = ["f0", "f20", "f40", "f60"];

    for (let i = 0; i < 4; i++) {
      const sx = lx + 36 + i * (slotW + slotGap);
      const isAct = i === activeSlot;
      roundRectPath(ctx, sx, slotY, slotW, slotH, 12);
      ctx.fillStyle = isAct ? "rgba(255, 93, 122, 0.22)" : "rgba(32, 20, 34, 0.82)";
      ctx.fill();
      ctx.lineWidth = isAct ? 2 : 1.2;
      ctx.strokeStyle = isAct ? "#ff5d7a" : "rgba(255, 93, 122, 0.34)";
      ctx.stroke();

      ctx.font = `700 15px ${MONO}`;
      ctx.fillStyle = isAct ? "#ffe4ea" : "#fda4af";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(frameTags[i], sx + slotW * 0.5, slotY + 28);

      ctx.font = `600 12px ${MONO}`;
      ctx.fillStyle = "rgba(253, 164, 175, 0.72)";
      ctx.fillText("fps=3", sx + slotW * 0.5, slotY + 54);

      if (i < 3) {
        const gx0 = sx + slotW + 8;
        const gx1 = sx + slotW + slotGap - 8;
        const gy = slotY + slotH * 0.5;
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "rgba(255, 93, 122, 0.55)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gx0, gy);
        ctx.lineTo(gx1, gy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = `700 11px ${MONO}`;
        ctx.fillStyle = "#ff758f";
        ctx.fillText("GAP", (gx0 + gx1) * 0.5, gy - 14);
        ctx.restore();
      }
    }
    ctx.textAlign = "left";

    // Section 2: Drifted Curve Plot
    ctx.font = `700 14px ${MONO}`;
    ctx.fillStyle = "#fda4af";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("DRIFTED CURVE & UNSTABLE HOLD PLATEAU", lx + 36, ly + 256);

    const pBoxX = lx + 36, pBoxY = ly + 272, pBoxW = lw - 72, pBoxH = 266;
    roundRectPath(ctx, pBoxX, pBoxY, pBoxW, pBoxH, 14);
    ctx.fillStyle = "rgba(10, 12, 20, 0.78)";
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(255, 93, 122, 0.24)";
    ctx.stroke();

    // Subtle plot grid
    ctx.save();
    ctx.strokeStyle = "rgba(148, 163, 184, 0.11)";
    ctx.lineWidth = 1;
    for (let g = 1; g <= 3; g++) {
      const gy = pBoxY + (pBoxH * g) / 4;
      ctx.beginPath();
      ctx.moveTo(pBoxX + 18, gy);
      ctx.lineTo(pBoxX + pBoxW - 18, gy);
      ctx.stroke();
    }

    const padL = 28, padR = 28, padT = 36, padB = 34;
    const gxW = pBoxW - padL - padR;
    const gyH = pBoxH - padT - padB;
    const gx0 = pBoxX + padL;
    const gyBottom = pBoxY + pBoxH - padB;

    // Target reference curve (dashed)
    ctx.setLineDash([7, 6]);
    ctx.strokeStyle = "rgba(148, 163, 184, 0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let s = 0; s <= 100; s++) {
      const u = s / 100;
      const px = gx0 + u * gxW;
      const py = gyBottom - targetCurveVal(u) * gyH;
      if (s === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Animated draw reveal of drifted curve
    const curveProg = easeOutCubic(clamp01((t - 0.5) / 2.2));
    const maxS = Math.max(2, Math.floor(curveProg * 100));
    ctx.strokeStyle = "#ff5d7a";
    ctx.lineWidth = 3.2;
    ctx.beginPath();
    for (let s = 0; s <= maxS; s++) {
      const u = s / 100;
      const px = gx0 + u * gxW;
      const py = gyBottom - naiveDriftedVal(u) * gyH;
      if (s === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Error delta shading at cursor
    const headU = maxS / 100;
    const hx = gx0 + headU * gxW;
    const hyTarget = gyBottom - targetCurveVal(headU) * gyH;
    const hyActual = gyBottom - naiveDriftedVal(headU) * gyH;
    ctx.strokeStyle = "rgba(255, 93, 122, 0.65)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx, hyTarget);
    ctx.lineTo(hx, hyActual);
    ctx.stroke();

    ctx.fillStyle = "#ff5d7a";
    ctx.beginPath();
    ctx.arc(hx, hyActual, 6.5, 0, Math.PI * 2);
    ctx.fill();

    // Legend tags inside plot
    ctx.font = `700 12px ${MONO}`;
    ctx.fillStyle = "rgba(148, 163, 184, 0.85)";
    ctx.fillText("--- Reference Path", pBoxX + 24, pBoxY + 22);
    ctx.fillStyle = "#ff8da1";
    ctx.fillText("━━ Drifted Output (Jitter + Lag)", pBoxX + 204, pBoxY + 22);
    ctx.restore();

    // Footer status
    roundRectPath(ctx, lx + 36, ly + lh - 68, lw - 72, 42, 10);
    ctx.fillStyle = "rgba(255, 93, 122, 0.11)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 93, 122, 0.30)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = `600 15px ${SANS}`;
    ctx.fillStyle = "#fecdd3";
    ctx.textBaseline = "middle";
    ctx.fillText("✕  Missed inflection timing · Hold-plateau vibration · Unsynced audio", lx + 54, ly + lh - 47);
    ctx.restore();

    // --- RIGHT CARD: kinearc v3.0 Workflow ---
    ctx.save();
    ctx.globalAlpha *= clamp01(rightP);
    ctx.translate(0, (1 - rightP) * 32);
    drawGlassCard(ctx, rx, ry, rw, rh, {
      radius: 20,
      fill: "rgba(11, 18, 34, 0.82)",
      border: "rgba(58, 210, 159, 0.50)",
      glow: "rgba(58, 210, 159, 0.16)",
    });

    // Header
    ctx.fillStyle = "#3ad29f";
    ctx.beginPath();
    ctx.arc(rx + 42, ry + 48, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = `800 28px ${SANS}`;
    ctx.fillStyle = "#ecfdf5";
    ctx.textBaseline = "middle";
    ctx.fillText("kinearc v3.0 Workflow", rx + 62, ry + 49);

    const okLabel = "MAE 0.84 CLEAN";
    ctx.font = `700 16px ${MONO}`;
    const okW = ctx.measureText(okLabel).width + 34;
    drawPill(ctx, rx + rw - 36 - okW, ry + 30, okLabel, {
      fg: "#6ee7b7",
      bg: "rgba(58, 210, 159, 0.16)",
      border: "rgba(58, 210, 159, 0.65)",
      font: `700 16px ${MONO}`,
      padX: 17,
      height: 38,
    });

    // Section 1: 5 Connected Badges
    ctx.font = `700 14px ${MONO}`;
    ctx.fillStyle = "#6ee7b7";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("5-STAGE DETERMINISTIC PIPELINE · 60 FPS LOCKED", rx + 36, ry + 114);

    const stages = [
      { num: "01", name: "Extract", col: "#6c8cff" },
      { num: "02", name: "Author", col: "#818cf8" },
      { num: "03", name: "Workbench", col: "#38bdf8" },
      { num: "04", name: "Mix", col: "#34d399" },
      { num: "05", name: "Export 4K", col: "#3ad29f" },
    ];
    const pipeX = rx + 36;
    const pipeW = rw - 72; // 752
    const badgeW = 122;
    const badgeH = 82;
    const arrowGap = (pipeW - badgeW * 5) / 4; // 35.5px
    const badgeY = ry + 132;
    const activePipe = (t * 1.35) % 5;

    for (let i = 0; i < stages.length; i++) {
      const bx = pipeX + i * (badgeW + arrowGap);
      const dist = Math.abs(((activePipe - i + 5) % 5));
      const highlight = clamp01(1 - Math.min(dist, 5 - dist) / 1.15);

      roundRectPath(ctx, bx, badgeY, badgeW, badgeH, 14);
      ctx.fillStyle = highlight > 0.25 ? "rgba(108, 140, 255, 0.22)" : "rgba(17, 25, 45, 0.88)";
      ctx.fill();
      ctx.lineWidth = highlight > 0.25 ? 2.2 : 1.3;
      ctx.strokeStyle = highlight > 0.25 ? stages[i].col : "rgba(148, 175, 255, 0.30)";
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `700 12px ${MONO}`;
      ctx.fillStyle = stages[i].col;
      ctx.fillText(`STAGE ${stages[i].num}`, bx + badgeW * 0.5, badgeY + 25);

      ctx.font = `800 17px ${SANS}`;
      ctx.fillStyle = "#f1f5f9";
      ctx.fillText(stages[i].name, bx + badgeW * 0.5, badgeY + 54);

      if (i < stages.length - 1) {
        const ax0 = bx + badgeW + 4;
        const ax1 = bx + badgeW + arrowGap - 4;
        const ay = badgeY + badgeH * 0.5;
        ctx.strokeStyle = "#3ad29f";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(ax0, ay);
        ctx.lineTo(ax1 - 5, ay);
        ctx.stroke();
        // Arrow head
        ctx.fillStyle = "#3ad29f";
        ctx.beginPath();
        ctx.moveTo(ax1, ay);
        ctx.lineTo(ax1 - 8, ay - 5);
        ctx.lineTo(ax1 - 8, ay + 5);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.textAlign = "left";

    // Section 2: Locked Curve Plot
    ctx.font = `700 14px ${MONO}`;
    ctx.fillStyle = "#6ee7b7";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("TIME-LOCKED CURVE · window.kinearc.seek(t)", rx + 36, ry + 256);

    const qBoxX = rx + 36, qBoxY = ry + 272, qBoxW = rw - 72, qBoxH = 266;
    roundRectPath(ctx, qBoxX, qBoxY, qBoxW, qBoxH, 14);
    ctx.fillStyle = "rgba(8, 13, 24, 0.80)";
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(58, 210, 159, 0.28)";
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = "rgba(148, 163, 184, 0.11)";
    ctx.lineWidth = 1;
    for (let g = 1; g <= 3; g++) {
      const gy = qBoxY + (qBoxH * g) / 4;
      ctx.beginPath();
      ctx.moveTo(qBoxX + 18, gy);
      ctx.lineTo(qBoxX + qBoxW - 18, gy);
      ctx.stroke();
    }

    const qx0 = qBoxX + padL;
    const qyBottom = qBoxY + qBoxH - padB;

    // Hold plateau highlight zone
    const holdX0 = qx0 + 0.36 * gxW;
    const holdX1 = qx0 + 0.68 * gxW;
    ctx.fillStyle = "rgba(58, 210, 159, 0.09)";
    ctx.fillRect(holdX0, qBoxY + 34, holdX1 - holdX0, qBoxH - 60);
    ctx.font = `700 11px ${MONO}`;
    ctx.fillStyle = "#3ad29f";
    ctx.textAlign = "center";
    ctx.fillText("HOLD PLATEAU (ZERO JITTER)", (holdX0 + holdX1) * 0.5, qBoxY + 52);
    ctx.textAlign = "left";

    // Target reference dashed
    ctx.setLineDash([7, 6]);
    ctx.strokeStyle = "rgba(148, 163, 184, 0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let s = 0; s <= 100; s++) {
      const u = s / 100;
      const px = qx0 + u * gxW;
      const py = qyBottom - targetCurveVal(u) * gyH;
      if (s === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Exact kinearc curve
    const qGrad = ctx.createLinearGradient(qx0, 0, qx0 + gxW, 0);
    qGrad.addColorStop(0, "#6c8cff");
    qGrad.addColorStop(0.5, "#3ad29f");
    qGrad.addColorStop(1, "#6c8cff");
    ctx.strokeStyle = qGrad;
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    for (let s = 0; s <= maxS; s++) {
      const u = s / 100;
      const px = qx0 + u * gxW;
      const py = qyBottom - targetCurveVal(u) * gyH;
      if (s === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    const qHx = qx0 + headU * gxW;
    const qHy = qyBottom - targetCurveVal(headU) * gyH;
    ctx.fillStyle = "rgba(58, 210, 159, 0.28)";
    ctx.beginPath();
    ctx.arc(qHx, qHy, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#3ad29f";
    ctx.beginPath();
    ctx.arc(qHx, qHy, 6.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = `700 12px ${MONO}`;
    ctx.fillStyle = "rgba(148, 163, 184, 0.85)";
    ctx.fillText("--- Target Motion", qBoxX + 24, qBoxY + 22);
    ctx.fillStyle = "#6ee7b7";
    ctx.fillText("━━ Locked 60fps Output (0.84 MAE)", qBoxX + 184, qBoxY + 22);
    ctx.restore();

    // Footer status
    roundRectPath(ctx, rx + 36, ry + rh - 68, rw - 72, 42, 10);
    ctx.fillStyle = "rgba(58, 210, 159, 0.12)";
    ctx.fill();
    ctx.strokeStyle = "rgba(58, 210, 159, 0.34)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = `600 15px ${SANS}`;
    ctx.fillStyle = "#d1fae5";
    ctx.textBaseline = "middle";
    ctx.fillText("✓  Savitzky-Golay LUTs · Hold-Plateau Locking · Auto-Ducked 4K 60fps", rx + 54, ry + rh - 47);
    ctx.restore();

    drawStepRail(ctx, W, 932, 0, t);
    ctx.restore();
    drawCornerHud(ctx, W, H, t, total, "KINEARC V3.0 · 00 / WHY KINEARC");
  },
});
</script>
</body>
</html>
