<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KineArc Tutorial — 01 Drop Any Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f7fb;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {
  clamp01,
  easeInOutCubic,
  easeOutCubic,
  lerp,
  smoothstep,
  springProgress,
  roundRectPath,
  drawCraftBackdrop,
  drawBlurRevealText,
  drawPearlCard,
  drawTactileCursor,
  drawFilmGrain,
  registerScene,
} from "./kinearc-gl3d.js";

const TOTAL = 4.5;
const SANS_FONT = '"Inter", "SF Pro Display", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif';

// @cue 0.25 swell volume=0.76
// @cue 1.20 tap volume=0.70
// @cue 2.05 latch volume=0.82
// @cue 2.35 ping volume=0.76

function drawStepPill(ctx, cx, y, label, progress) {
  const p = clamp01(progress);
  if (p <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = p;
  ctx.translate(cx, y + (1 - easeOutCubic(p)) * 12);
  ctx.font = `700 15px ${SANS_FONT}`;
  const tw = ctx.measureText(label).width;
  const w = tw + 38;
  const h = 36;
  roundRectPath(ctx, -w * 0.5, -h * 0.5, w, h, h * 0.5);
  ctx.fillStyle = "rgba(124, 58, 237, 0.10)";
  ctx.fill();
  ctx.lineWidth = 1.25;
  ctx.strokeStyle = "rgba(124, 58, 237, 0.28)";
  ctx.stroke();

  ctx.fillStyle = "#6d28d9";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, 0, 1);
  ctx.restore();
}

function drawMiniVideoCard(ctx, cx, cy, {
  w = 224,
  h = 122,
  rot = 0,
  scale = 1,
  alpha = 1,
  shadowScale = 1,
} = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  // Soft porcelain card shell
  ctx.shadowColor = `rgba(65, 58, 128, ${0.18 * shadowScale})`;
  ctx.shadowBlur = 28 * shadowScale;
  ctx.shadowOffsetY = 12 * shadowScale;
  roundRectPath(ctx, -w * 0.5, -h * 0.5, w, h, 20);
  ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = "rgba(124, 58, 237, 0.24)";
  ctx.stroke();

  // Pastel thumbnail strip inside card
  const pad = 10;
  const thumbW = w - pad * 2;
  const thumbH = 66;
  roundRectPath(ctx, -thumbW * 0.5, -h * 0.5 + pad, thumbW, thumbH, 12);
  const grad = ctx.createLinearGradient(-thumbW * 0.5, -h * 0.5 + pad, thumbW * 0.5, -h * 0.5 + pad + thumbH);
  grad.addColorStop(0, "#ede9fe");
  grad.addColorStop(0.55, "#ddd6fe");
  grad.addColorStop(1, "#bae6fd");
  ctx.fillStyle = grad;
  ctx.fill();

  // Play circle & crisp play triangle
  const py = -h * 0.5 + pad + thumbH * 0.5;
  ctx.beginPath();
  ctx.arc(0, py, 16, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(24, 24, 27, 0.82)";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-4.5, py - 6.5);
  ctx.lineTo(7.5, py);
  ctx.lineTo(-4.5, py + 6.5);
  ctx.closePath();
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  // Clean everyday label
  ctx.font = `600 15px ${SANS_FONT}`;
  ctx.fillStyle = "#18181b";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("clip.mp4 · 12s", 0, h * 0.5 - 22);

  ctx.restore();
}

function drawCheckWave(ctx, cx, cy, progress) {
  const p = clamp01(progress);
  if (p <= 0.001 || p >= 1) return;
  const e = easeOutCubic(p);
  const r = lerp(42, 260, e);
  ctx.save();
  ctx.strokeStyle = "rgba(124, 58, 237, 0.65)";
  ctx.globalAlpha = (1 - p) * 0.72;
  ctx.lineWidth = 3.2 * (1 - p * 0.65);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  const r2 = lerp(24, 180, clamp01(p * 1.15));
  ctx.strokeStyle = "rgba(16, 185, 129, 0.55)";
  ctx.globalAlpha = Math.max(0, 1 - p * 1.1) * 0.55;
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  ctx.arc(cx, cy, r2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

registerScene({
  width: 1920,
  height: 1080,
  fps: 60,
  totalDuration: TOTAL,
  onFrame({ ctx, W, H, t }) {
    drawCraftBackdrop(ctx, W, H, t, {
      theme: "pearl",
      warmPool: "rgba(167, 139, 250, 0.14)",
      coolPool: "rgba(56, 189, 248, 0.11)",
      showCrosshairs: false,
    });

    const cx = W * 0.5;
    const dropCy = 610 + Math.sin(t * 1.35) * 3.5;

    // 1. Top header (generous whitespace above and below)
    drawStepPill(ctx, cx, 152, "STEP 01", springProgress(t, { delay: 0.04, duration: 0.55 }));
    drawBlurRevealText(ctx, "Drop in any video.", cx, 266, smoothstep(0.10, 0.82, t), {
      font: `800 84px ${SANS_FONT}`,
      color: "#18181b",
      maxBlur: 18,
      liftPx: 20,
    });
    drawBlurRevealText(ctx, "Like the rhythm or vibe of a clip? Start right there.", cx, 328, smoothstep(0.26, 0.96, t), {
      font: `500 26px ${SANS_FONT}`,
      color: "#52525b",
      maxBlur: 10,
      liftPx: 14,
    });

    // 2. Center Frosted Porcelain Drop Pill (~640x240px)
    const cardEnter = springProgress(t, { delay: 0.16, duration: 0.65, damping: 16, stiffness: 180 });
    const hoverProximity = smoothstep(1.55, 2.00, t) * (1 - smoothstep(2.05, 2.25, t));
    const dropped = t >= 2.05;
    const dropAge = Math.max(0, t - 2.05);
    const bopPulse = dropped
      ? 0.072 * Math.sin(clamp01(dropAge / 0.28) * Math.PI) * Math.exp(-dropAge * 2.2)
      : 0;
    const settleHold = dropped ? 0.014 * springProgress(t, { delay: 2.05, damping: 14, stiffness: 200 }) : 0;
    const cardScale = lerp(0.92, 1.0, cardEnter) * (1.0 + hoverProximity * 0.022 + bopPulse + settleHold);

    const cardW = 640;
    const cardH = 240;
    const latchGlow = smoothstep(2.05, 2.25, t);
    const activeAmt = Math.max(hoverProximity * 0.65, latchGlow);

    ctx.save();
    ctx.globalAlpha = clamp01(cardEnter * 1.2);
    ctx.translate(cx, dropCy);
    ctx.scale(cardScale, cardScale);

    drawPearlCard(ctx, -cardW * 0.5, -cardH * 0.5, cardW, cardH, {
      radius: 34,
      bg: dropped ? "rgba(255, 255, 255, 0.97)" : "rgba(255, 255, 255, 0.92)",
      border: "rgba(109, 93, 211, 0.16)",
      activeBorder: activeAmt > 0.05 ? `rgba(124, 58, 237, ${(0.22 + activeAmt * 0.48).toFixed(3)})` : null,
      activeGlow: activeAmt > 0.05 ? `rgba(124, 58, 237, ${(0.14 + activeAmt * 0.16).toFixed(3)})` : null,
      shadowBlur: 40,
    });

    // Inner dashed porcelain ring (pre-drop) -> swaps cleanly into active state with zero overlap
    const preDropAlpha = 1 - smoothstep(2.02, 2.11, t);
    if (preDropAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = preDropAlpha;
      ctx.setLineDash([10, 9]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = hoverProximity > 0.1 ? "rgba(124, 58, 237, 0.62)" : "rgba(124, 58, 237, 0.26)";
      roundRectPath(ctx, -cardW * 0.5 + 16, -cardH * 0.5 + 16, cardW - 32, cardH - 32, 24);
      ctx.stroke();
      ctx.setLineDash([]);

      // Soft icon mark
      ctx.fillStyle = "rgba(124, 58, 237, 0.10)";
      ctx.beginPath();
      ctx.arc(0, -34, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#7c3aed";
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(0, -45);
      ctx.moveTo(-8, -37);
      ctx.lineTo(0, -45);
      ctx.lineTo(8, -37);
      ctx.stroke();

      ctx.font = `700 24px ${SANS_FONT}`;
      ctx.fillStyle = "#18181b";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Drop any video clip", 0, 20);

      ctx.font = `500 17px ${SANS_FONT}`;
      ctx.fillStyle = "#64748b";
      ctx.fillText("Drag & release to begin", 0, 52);
      ctx.restore();
    }

    // Post-drop Ready state inside drop card
    const readyAlpha = smoothstep(2.13, 2.30, t);
    if (readyAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = readyAlpha;

      // Docked sleek mini preview on the left
      drawMiniVideoCard(ctx, -158, 0, {
        w: 204,
        h: 114,
        rot: 0,
        scale: lerp(0.94, 1.0, readyAlpha),
        alpha: readyAlpha,
        shadowScale: 0.45,
      });

      // Expanding emerald + violet check badge & copy on the right
      const checkX = -8;
      const checkY = -22;
      const badgePop = springProgress(t, { delay: 2.18, duration: 0.45, damping: 12, stiffness: 250 });

      ctx.save();
      ctx.translate(checkX, checkY);
      ctx.scale(badgePop, badgePop);
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#10b981";
      ctx.fill();

      const drawTick = smoothstep(2.22, 2.46, t);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-7, 0.5);
      if (drawTick < 0.45) {
        const u = drawTick / 0.45;
        ctx.lineTo(lerp(-7, -2, u), lerp(0.5, 5.5, u));
      } else {
        const u = (drawTick - 0.45) / 0.55;
        ctx.lineTo(-2, 5.5);
        ctx.lineTo(lerp(-2, 7.5, u), lerp(5.5, -5.5, u));
      }
      ctx.stroke();
      ctx.restore();

      ctx.font = `700 28px ${SANS_FONT}`;
      ctx.fillStyle = "#18181b";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("Ready to analyze", 24, -22);

      ctx.font = `500 18px ${SANS_FONT}`;
      ctx.fillStyle = "#6d28d9";
      ctx.fillText("12s clip locked in", -26, 22);

      // Subtle violet progress sheen across bottom edge
      const sheenP = smoothstep(2.30, 3.30, t);
      roundRectPath(ctx, -26, 48, 286, 6, 3);
      ctx.fillStyle = "rgba(124, 58, 237, 0.12)";
      ctx.fill();
      if (sheenP > 0.01) {
        roundRectPath(ctx, -26, 48, 286 * sheenP, 6, 3);
        const sGrad = ctx.createLinearGradient(-26, 48, 260, 48);
        sGrad.addColorStop(0, "#7c3aed");
        sGrad.addColorStop(1, "#a78bfa");
        ctx.fillStyle = sGrad;
        ctx.fill();
      }

      ctx.restore();
    }

    ctx.restore();

    // Expanding check wave ring at t=2.25s
    drawCheckWave(ctx, cx, dropCy, smoothstep(2.25, 3.25, t));

    // 3. Tactile Cursor dragging the mini video card from open right space (0.8..2.05s)
    const startPos = [1560, 412];
    const grabPos = [1520, 430];
    const dropPos = [cx, dropCy];
    const exitPos = [1150, 790];

    let curX = startPos[0];
    let curY = startPos[1];
    let curAlpha = 0;

    if (t >= 0.65 && t < 1.20) {
      const p = easeOutCubic(smoothstep(0.65, 1.18, t));
      curX = lerp(startPos[0] + 140, grabPos[0], p);
      curY = lerp(startPos[1] - 90, grabPos[1], p);
      curAlpha = smoothstep(0.65, 0.90, t);
    } else if (t >= 1.20 && t <= 2.05) {
      const p = easeInOutCubic(smoothstep(1.20, 2.05, t));
      // Smooth slight arc downward-left
      const arcY = Math.sin(p * Math.PI) * -55;
      curX = lerp(grabPos[0], dropPos[0], p);
      curY = lerp(grabPos[1], dropPos[1], p) + arcY;
      curAlpha = 1;
    } else if (t > 2.05) {
      const p = easeOutCubic(smoothstep(2.20, 3.10, t));
      curX = lerp(dropPos[0], exitPos[0], p);
      curY = lerp(dropPos[1], exitPos[1], p);
      curAlpha = 1 - smoothstep(3.25, 3.85, t);
    }

    // Floating dragged mini card prior to docking at t=2.05s
    if (t < 2.12) {
      const appear = springProgress(t, { delay: 0.45, duration: 0.50 });
      const dragP = smoothstep(1.20, 2.05, t);
      const cardX = t < 1.20 ? grabPos[0] : curX;
      const cardY = t < 1.20 ? grabPos[1] : curY;
      const tilt = t < 1.20 ? 0.03 : -0.08 * Math.sin(dragP * Math.PI);
      const scaleDrag = t >= 2.05
        ? lerp(1.03, 0.85, smoothstep(2.05, 2.12, t))
        : lerp(0.88, 1.0, appear) * (1 + smoothstep(1.16, 1.28, t) * 0.04);
      const floatingAlpha = clamp01(appear) * (1 - smoothstep(2.04, 2.11, t));

      drawMiniVideoCard(ctx, cardX, cardY, {
        w: 224,
        h: 122,
        rot: tilt,
        scale: scaleDrag,
        alpha: floatingAlpha,
        shadowScale: t >= 1.20 ? 1.35 : 0.9,
      });
    }

    if (curAlpha > 0.01) {
      const isDragging = t >= 1.18 && t < 2.05;
      let clickProg = 0;
      if (t >= 1.20 && t < 1.65) {
        clickProg = smoothstep(1.20, 1.62, t);
      } else if (t >= 2.05 && t < 2.55) {
        clickProg = smoothstep(2.05, 2.52, t);
      }
      ctx.save();
      ctx.globalAlpha = curAlpha;
      drawTactileCursor(ctx, curX, curY, {
        pressed: isDragging,
        clickProgress: clickProg,
        color: "#ffffff",
        accent: "#7c3aed",
      });
      ctx.restore();
    }

    drawFilmGrain(ctx, W, H, t, 0.020);
  },
});
</script>
</body>
</html>
