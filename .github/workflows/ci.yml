name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install opencv-python-headless numpy pytest

      - name: Install FFmpeg & Browser (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl ca-certificates
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || command -v microsoft-edge || true)"
          if [ -z "$CHROME_BIN" ]; then
            curl -fsSL -o /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y --no-install-recommends /tmp/google-chrome.deb
            rm -f /tmp/google-chrome.deb
            CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-family browser found or installed on Linux runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          ffmpeg -version
          ffprobe -version
          "$CHROME_BIN" --version

      - name: Verify FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            winget install -e --id Gyan.FFmpeg --accept-source-agreements --accept-package-agreements
          }
          $winGetLinks = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Links"
          $pkgRoot = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages"
          $pkgBins = @(
            Get-ChildItem -Path $pkgRoot -Directory -Filter "Gyan.FFmpeg*" -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem -Path $_.FullName -Directory -Recurse -Filter "bin" -ErrorAction SilentlyContinue } |
              Select-Object -ExpandProperty FullName
          )
          $chocoBin = if ($env:ProgramData) { Join-Path $env:ProgramData "chocolatey\bin" } else { $null }
          $extraPaths = @($pkgBins) + @($winGetLinks, $chocoBin) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          foreach ($dir in $extraPaths) {
            if (($env:PATH -split ';') -notcontains $dir) {
              $env:PATH = "$dir;$env:PATH"
            }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install ffmpeg -y --no-progress
              if ($chocoBin -and (Test-Path -LiteralPath $chocoBin)) {
                $env:PATH = "$chocoBin;$env:PATH"
                Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
              }
            }
          }
          ffmpeg -version
          ffprobe -version

      - name: Syntax check JavaScript & ESM engine modules
        shell: bash
        run: |
          for f in scripts/ui/*.js engine/*.mjs assets/craft/*.js examples/kinearc-promo-3d/scenes/*.js examples/kinearc-tutorial/scenes/*.js; do
            node --check "$f"
          done

      - name: Syntax check installer & Python scripts
        run: |
          python -B -c "import py_compile, pathlib, tempfile; td=tempfile.mkdtemp(); [py_compile.compile(str(p), cfile=str(pathlib.Path(td)/p.name), doraise=True) for p in [pathlib.Path('install.py'), *sorted(pathlib.Path('scripts').glob('*.py'))]]"

      - name: Run kinearc environment doctor
        run: python -B scripts/kinearc_cli.py doctor --json --strict

      - name: Run full pytest suite
        run: python -B -m pytest -p no:cacheprovider tests/ -v
